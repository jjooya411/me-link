/* 6) 감정의 흐름 ---------------------------------------------------- */
RV.flow = () => {
  const now = new Date(); const fl = state.flow || (state.flow = { y: now.getFullYear(), m: now.getMonth() });
  const ls = Arch.mine().filter(l => !Arch.sealed(l));
  const inM = ls.filter(l => Arch.inMonth(l, fl.y, fl.m)).sort(Arch.byDate);
  const count = {}; const add = (e, k) => { (count[e] = count[e] || { am: 0, pm: 0 })[k]++; };
  inM.forEach(l => { feelText(l.emotions, l.custom).forEach(e => add(e, "am")); if (l.reply) feelText(l.reply.emotions, l.reply.custom).forEach(e => add(e, "pm")); });
  const names = Object.keys(count).sort((a, b) => (EMOTIONS.indexOf(a) + 1 || 99) - (EMOTIONS.indexOf(b) + 1 || 99));
  const msg = names.length >= 3 ? "이번 달에는 다양한 마음을 경험했어." : names.length ? "이번 달에 남겨 둔 마음들이야." : "이번 달에는 마음을 고른 기록이 없어. 고르지 않아도 괜찮아.";
  const dim = new Date(fl.y, fl.m + 1, 0).getDate(); const byDay = {};
  inM.forEach(l => { const d = new Date(l.createdAt).getDate(); (byDay[d] = byDay[d] || { am: [], pm: [] }); byDay[d].am.push(...feelText(l.emotions, l.custom)); if (l.reply) byDay[d].pm.push(...feelText(l.reply.emotions, l.reply.custom)); });
  let strip = ""; for (let d = 1; d <= dim; d++) { const x = byDay[d]; const am = x ? [...new Set(x.am)] : [], pm = x ? [...new Set(x.pm)] : [];
    strip += `<div class="fday ${am.length || pm.length ? "has" : ""}" ${am.length || pm.length ? `aria-label="${esc(`${d}일, 아침: ${am.join(", ") || "고르지 않음"}${pm.length ? ", 저녁: " + pm.join(", ") : ""}`)}"` : 'aria-hidden="true"'}><span class="am">${am.slice(0, 3).map(e => emoIcon(e, 14)).join("")}</span><span class="pm">${pm.slice(0, 2).map(e => emoIcon(e, 14)).join("")}</span><span class="d">${d}</span></div>`; }
  const both = inM.filter(l => l.reply && feelText(l.emotions, l.custom).length && feelText(l.reply.emotions, l.reply.custom).length);
  const ys = Arch.years();
  const yearRow = Array.from({ length: 12 }, (_, i) => {
    const ems = [...new Set(ls.filter(l => Arch.inMonth(l, fl.y, i)).flatMap(Arch.emotions))];
    return `<button class="ymon" data-fmonth="${i}" aria-pressed="${i === fl.m}" aria-label="${esc(`${i + 1}월${ems.length ? ": " + ems.join(", ") : ""}`)}"><span>${i + 1}월</span><span class="ic">${ems.slice(0, 4).map(e => emoIcon(e, 12)).join("")}</span></button>`; }).join("");
  const yi = ys.indexOf(fl.y);
  return `<section style="display:flex;flex-direction:column;gap:12px">
    <div class="year-nav"><button class="icon-btn" data-fyear="${ys[yi + 1] || ""}" ${ys[yi + 1] ? "" : "disabled"} aria-label="이전 해">${G.back}</button><b>${fl.y}년</b>
      <button class="icon-btn flip" data-fyear="${ys[yi - 1] || ""}" ${ys[yi - 1] ? "" : "disabled"} aria-label="다음 해">${G.back}</button></div>
    <div class="year-grid" role="group" aria-label="달마다 남긴 마음">${yearRow}</div></section>
  <section class="flow-sec"><h2 class="flow-h">${fl.m + 1}월의 마음</h2>
    <p class="flow-msg">${msg}</p>
    ${names.length ? `<div class="flow-chips">${names.map(e => `<span class="fchip">${emoIcon(e, 16)}<b>${esc(e)}</b><span>${count[e].am + count[e].pm}번</span></span>`).join("")}</div>
      <p class="note">아침과 저녁에 직접 고른 마음을 모두 세었어. 한 번에 여러 마음을 고른 날은 각각 셌어.</p>` : ""}
  </section>
  <section class="flow-sec"><h2 class="flow-h">날짜별 마음</h2>
    <div class="fstrip-wrap"><div class="fstrip">${strip}</div></div>
    <p class="note">위쪽은 아침, 아래쪽은 저녁에 고른 마음이야. 고르지 않은 날은 비워 두고, 짐작해서 채우지 않아.</p>
  </section>
  <section class="flow-sec"><h2 class="flow-h">아침의 마음과 저녁의 마음</h2>
    ${both.length ? `<div style="display:flex;flex-direction:column;gap:10px">${both.map(l => `<button class="cmp" data-open="${l.id}"><span class="when">${fullDate(l.createdAt)}</span>
      <span class="cmp-row"><span class="label">아침</span><span class="row" style="gap:6px">${feelText(l.emotions, l.custom).map(emoTag).join("")}</span></span>
      <span class="cmp-row"><span class="label">저녁</span><span class="row" style="gap:6px">${feelText(l.reply.emotions, l.reply.custom).map(emoTag).join("")}</span></span></button>`).join("")}</div>`
      : `<div class="empty">아침과 저녁 모두 마음을 고른 날만 나란히 보여 줘. 이 달에는 아직 없어.</div>`}
  </section>
  <p class="closing">그때의 마음도 지금의 마음도 모두 나의 일부야.</p>`;
};

/* 7) 나의 성장 포트폴리오 ------------------------------------------- */
const PF_TOPICS = ["내가 기억하고 싶은 순간", "새롭게 발견한 나의 모습", "내가 좋아하는 것들", "나를 힘들게 했던 순간", "나에게 힘이 되었던 것들", "친구와의 관계에서 발견한 것", "예전과 달라진 나의 생각", "앞으로의 나에게 보내는 편지"];
function semesterRange(d = new Date()) {
  const y = d.getFullYear(), m = d.getMonth();
  if (m >= 2 && m <= 7) return { label: `${y}년 1학기`, from: new Date(y, 2, 1), to: new Date(y, 8, 0, 23, 59) };
  const sy = m >= 8 ? y : y - 1; return { label: `${sy}년 2학기`, from: new Date(sy, 8, 1), to: new Date(sy + 1, 2, 0, 23, 59) };
}
function pfWalks(p) { return repo.walks.all().filter(x => !p.from || (x.startedAt >= p.from && x.startedAt <= p.to)).sort((a, b) => a.startedAt.localeCompare(b.startedAt)); }
function pfLetters(p) { return Arch.mine().filter(l => !Arch.sealed(l) && (!p.from || (l.createdAt >= p.from && l.createdAt <= p.to))).sort(Arch.byDate); }
RV.portfolio = () => {
  const ps = state.pf || (state.pf = { id: null, preview: false, replies: true, emotions: true });
  if (ps.id && repo.portfolios.get(ps.id)) return ps.preview ? pfPreview(repo.portfolios.get(ps.id)) : pfEdit(repo.portfolios.get(ps.id));
  const list = repo.portfolios.all().sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));
  return `<section style="display:flex;flex-direction:column;gap:14px">
    <p class="intro">한 학기나 한 해를 돌아보며 나만의 이야기를 엮어 봐. 내가 고른 기록만 담기고, 누구에게도 자동으로 제출되거나 공유되지 않아.</p>
    <button class="btn btn-primary btn-block" data-act="pf-new">새 포트폴리오 만들기</button>
    ${list.length ? list.map(p => { const n = new Set(p.sections.flatMap(s => s.letterIds)).size; const nw = new Set(p.sections.flatMap(s => s.walkIds || [])).size;
      return `<button class="pf-card" data-pfopen="${p.id}"><b>${esc(p.title)}</b><span class="small muted">${esc(p.periodLabel)} · 주제 ${p.sections.length}개 · 편지 ${n}통${nw ? ` · 마음 산책 ${nw}개` : ""}</span><span class="tiny muted">${fullDate(p.updatedAt)}에 고침</span></button>`; }).join("")
      : `<div class="empty">아직 만든 포트폴리오가 없어. 학기 말이나 마음이 내킬 때 시작해도 좋아.</div>`}
  </section>`;
};

  const periods = [{ k: "sem", t: `이번 학기 (${sem.label})`, from: sem.from, to: sem.to, label: sem.label }, { k: "year", t: `올해 (${y}년)`, from: new Date(y, 0, 1), to: new Date(y, 11, 31, 23, 59), label: `${y}년` }, { k: "all", t: "전체 기간", from: null, to: null, label: "전체 기간" }];

        <button class="icon-btn sm" data-act="pw-del" data-sec="${s.id}" data-id="${id}" aria-label="이 기록 빼기">×</button></li>`; }).join("")}</ul>` : ""}
      <div class="row" style="gap:8px"><button class="btn btn-ghost" data-act="sec-pick" data-sec="${s.id}">편지 고르기${s.letterIds.length ? ` (${s.letterIds.length}통)` : ""}</button>

function pfSave(mut) { const p = repo.portfolios.get(state.pf.id); mut(p); repo.portfolios.put(p); return p; }
function pfPickDialog(secId) {
  const p = repo.portfolios.get(state.pf.id); const s = p.sections.find(x => x.id === secId);
  const cands = pfLetters(p); const chosen = new Set(s.letterIds);
  const draw = () => `<h2 id="dialog-title">${esc(s.title)}에 담을 편지</h2>
    <p class="note">${esc(p.periodLabel)}의 편지 중에서 원하는 것만 골라. 고르지 않은 편지는 포트폴리오에 담기지 않아.</p>
    ${cands.length ? `<div class="pick-list">${cands.map(l => `<button type="button" class="pick" role="checkbox" data-pick="${l.id}" aria-checked="${chosen.has(l.id)}"><span class="box" aria-hidden="true"></span>
      <span style="min-width:0"><span class="tiny muted">${fullDate(l.createdAt)}${l.favorite ? " · 간직한 편지" : ""}</span><br><span class="small">${esc(l.title || letterTitle(l))}</span><br><span class="tiny muted">${esc((l.body || "").slice(0, 50))}</span></span></button>`).join("")}</div>`
      : `<div class="empty">이 기간에는 담을 수 있는 편지가 없어.</div>`}
    <div class="row" style="justify-content:space-between"><span class="small muted">${chosen.size}통 고름</span><span class="row"><button class="btn btn-ghost" data-r="0">닫기</button><button class="btn btn-primary" data-r="1">담기</button></span></div>`;

    sheet.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { const id = b.dataset.pick; chosen.has(id) ? chosen.delete(id) : chosen.add(id); const top = sheet.scrollTop; sheet.innerHTML = draw(); mount(sheet); sheet.scrollTop = top; });
    sheet.querySelector('[data-r="0"]').onclick = closeDialog;
    sheet.querySelector('[data-r="1"]').onclick = () => { pfSave(pp => { const sec = pp.sections.find(x => x.id === secId);
      const keep = sec.letterIds.filter(id => chosen.has(id)); const added = cands.filter(l => chosen.has(l.id) && !keep.includes(l.id)).map(l => l.id); sec.letterIds = [...keep, ...added]; }); closeDialog(); render(); };
  };

}
function pfPickWalkDialog(secId) {

      ${o.emotions && f.length ? `<p class="pd-emo">그때의 마음: ${f.map(esc).join(", ")}</p>` : ""}

      ${o.replies ? (l.laterReplies || []).map(lr => `<div class="pd-reply"><p class="pd-lab">다시 만난 나 · ${fullDate(lr.createdAt)}</p><p class="pd-body">${esc(lr.body)}</p></div>`).join("") : ""}</div>`; };

function pfText(p, o) {
  const byId = Object.fromEntries(Arch.mine().map(l => [l.id, l]));
  let t = `${p.title}\n${p.periodLabel}\n`;
  p.sections.forEach(s => { t += `\n■ ${s.title}\n${s.note ? s.note + "\n" : ""}`;
    s.letterIds.forEach(id => { const l = byId[id]; if (!l) return; const q = questionFor(l);
      t += `\n- ${fullDate(l.createdAt)} · ${qText(l) || "자유 주제"}\n${l.body || ""}\n`;
      if (o.emotions && feelText(l.emotions, l.custom).length) t += `(그때의 마음: ${feelText(l.emotions, l.custom).join(", ")})\n`;
      if (o.replies && l.reply) t += `저녁의 나: ${l.reply.body}\n`;
      if (o.replies) (l.laterReplies || []).forEach(lr => t += `다시 만난 나(${fullDate(lr.createdAt)}): ${lr.body}\n`); });
    (s.walkIds || []).forEach(id => { const x = repo.walks.get(id); if (!x) return; t += `\n- ${fullDate(x.startedAt)} · 마음 산책 ${fmtDur(x.actualSec)}${x.reflection ? "\n" + x.reflection : ""}\n`; }); });
  return t;
}

   ========================================================= */
const Relation = {
  data: null, err: false, loading: null,
  load() {
    if (this.data || this.loading) return this.loading;
    this.loading = fetch("data/relation.json", { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error("rel"); return r.json(); })
      .then(d => { this.data = d; this.err = false; }).catch(() => { this.err = true; })
      .finally(() => { this.loading = null; if (["rel", "relq", "relcard"].includes(state.view)) render(); });
    return this.loading;
  },
  topic(id) { return this.data && this.data.topics.find(t => t.id === id); },
  /* ‘가볍게 시작하기’는 기존 질문을 ID 그대로 연결하고 문장은 질문 은행에서 읽는다 */
  list(id) { const t = this.topic(id); if (!t) return [];
    return t.existing ? t.existing.map(k => Questions.byId[k]).filter(Boolean).map(q => ({ id: q.id, morning: q.morning, evening: q.evening })) : t.questions; },
  card(id) { return this.data && this.data.cards.find(c => c.id === id); }
};

/* 편지에서 문장 골라 더하기 (5-2): 편지 본문 전체를 기본으로 넣지 않는다.
   1) 편지를 고르면 2) 문장 단위로 나눠 보여 주고(아무것도 선택되지 않은 상태) 3) 학생이 고른 문장만 미리 보기 글상자에 담긴다.

const splitSentences = t => (t || "").split(/\n+/).flatMap(line => line.match(/[^.!?。…]+[.!?。…]*\s*/g) || []).map(x => x.trim()).filter(Boolean);
function hmLetterDialog() {
  const ls = repo.letters.all().filter(l => Delivery.status(l) !== "waiting" && l.body).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  let pick = null, sel = new Set(), edited = null;
  const sents = () => pick ? splitSentences(repo.letters.get(pick).body) : [];
  const chosenText = () => sents().filter((_, i) => sel.has(i)).join(" ");
  const draw = () => !pick ? `<h2 id="dialog-title">편지 고르기</h2>
    <p class="note">상담을 요청할 때 편지 원문을 보여 주지 않아도 괜찮아. 다음 단계에서 필요한 문장만 고를 수 있고, 아무것도 고르지 않으면 아무것도 더해지지 않아.</p>
    ${ls.length ? `<div class="pick-list">${ls.map(l => `<button type="button" class="pick" data-hpick="${l.id}"><span style="min-width:0"><span class="tiny muted">${fullDate(l.createdAt)}</span><br><span class="small">${esc(letterTitle(l))}</span></span></button>`).join("")}</div>` : `<div class="empty">더할 수 있는 편지가 없어.</div>`}
    <div class="row" style="justify-content:flex-end"><button class="btn btn-ghost" data-r="0">닫기</button></div>`
  : `<h2 id="dialog-title">더할 문장 고르기</h2>
    <p class="note">더하고 싶은 문장만 골라 줘. 처음에는 아무것도 선택되어 있지 않아.</p>
    <div class="pick-list" role="group" aria-label="편지 문장">${sents().map((x, i) => `<button type="button" class="pick" role="checkbox" data-hsent="${i}" aria-checked="${sel.has(i)}"><span class="box" aria-hidden="true"></span><span class="small" style="min-width:0">${esc(x)}</span></button>`).join("")}</div>
    <label class="small" for="hm-letter-preview"><b>더해질 내용</b> (여기서 고치거나 지울 수 있어)</label>
    <textarea id="hm-letter-preview" class="input" style="min-height:90px;padding:10px">${esc(edited != null ? edited : chosenText())}</textarea>
    <div class="row" style="justify-content:space-between"><button class="btn btn-text" data-r="back">다른 편지 고르기</button>
      <span class="row" style="gap:6px"><button class="btn btn-ghost" data-r="0">닫기</button><button class="btn btn-primary" data-r="1">이 내용 더하기</button></span></div>`;
  const mount = sh => {
    const re = () => { const top = sh.scrollTop; sh.innerHTML = draw(); mount(sh); sh.scrollTop = top; };
    sh.querySelectorAll("[data-hpick]").forEach(b => b.onclick = () => { pick = b.dataset.hpick; sel = new Set(); edited = null; re(); });
    sh.querySelectorAll("[data-hsent]").forEach(b => b.onclick = () => { const i = +b.dataset.hsent; sel.has(i) ? sel.delete(i) : sel.add(i); edited = null; re(); });
    const pv = sh.querySelector("#hm-letter-preview"); if (pv) pv.oninput = () => { edited = pv.value; };
    sh.querySelector('[data-r="0"]').onclick = closeDialog;
    const back = sh.querySelector('[data-r="back"]'); if (back) back.onclick = () => { pick = null; sel = new Set(); edited = null; re(); };
    const ok = sh.querySelector('[data-r="1"]'); if (ok) ok.onclick = () => {
      const add = (pv ? pv.value : "").trim(); if (!add) { toast("더할 문장을 고르거나 적어 줘.", null, { info: true }); return; }
      state.hm.text = (state.hm.text.trim() ? state.hm.text.trim() + "\n\n" : "") + `(제가 적어 두었던 글 중 일부예요)\n${add}`; closeDialog(); render(); toast("고른 문장을 더했어. 보내기 전에 확인하고 고쳐도 돼.", null, { info: true }); };
  };
  openDialog(draw(), mount);
}

/* 파일 저장: Claude의 파일 저장 기능 → (아티팩트 밖에서만) 브라우저 다운로드. 결과를 그대로 돌려준다 */
async function saveFile(name, data, type) {
  try { const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({ filename: name, data }); toast("파일을 저장했어", null, { info: true }); return "saved"; } }
  catch (e) { if (e && e.code === "declined") return "declined"; if (e && e.code === "rate_limited") return "busy"; }
  if (FRAMED) return "unavailable";
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    toast("파일 저장을 요청했어. 내려받은 파일을 확인해 줘.", null, { info: true }); return "saved"; }
  catch (e) { return "unavailable"; }
}

function wkRange(span, anchor) {
  const a = new Date(anchor + "T00:00");
  if (span === "week") { const s = new Date(a); s.setDate(a.getDate() - ((a.getDay() + 6) % 7)); const e = new Date(s); e.setDate(s.getDate() + 7);
    const last = new Date(e); last.setDate(e.getDate() - 1); return { s, e, label: `${s.getMonth() + 1}월 ${s.getDate()}일 – ${last.getMonth() + 1}월 ${last.getDate()}일` }; }
  if (span === "month") return { s: new Date(a.getFullYear(), a.getMonth(), 1), e: new Date(a.getFullYear(), a.getMonth() + 1, 1), label: `${a.getFullYear()}년 ${a.getMonth() + 1}월` };
  if (span === "year") return { s: new Date(a.getFullYear(), 0, 1), e: new Date(a.getFullYear() + 1, 0, 1), label: `${a.getFullYear()}년` };
  return { s: new Date(2000, 0, 1), e: new Date(2100, 0, 1), label: "모든 기간" };
}
const TIME_BUCKETS = [["새벽", 0, 6], ["아침", 6, 9], ["낮", 9, 12], ["오후", 12, 17], ["저녁", 17, 21], ["밤", 21, 24]];
function walkStats(list) {
  const total = list.reduce((a, x) => a + (x.actualSec || 0), 0);
  const buckets = TIME_BUCKETS.map(([n, a, b]) => ({ n, a, b, c: list.filter(x => { const h = new Date(x.startedAt).getHours(); return h >= a && h < b; }).length }));
  const reasons = {}; list.forEach(x => walkReasons(x).forEach(r => reasons[r] = (reasons[r] || 0) + 1));
  const kinds = {}; list.forEach(x => { const k = WALK_THEME[x.theme] ? x.theme : x.kind === "senses" ? "senses" : "rest"; kinds[k] = (kinds[k] || 0) + 1; });
  return { count: list.length, total, buckets, reasons, kinds, approx: list.some(x => x.approx) };
}

/* 예시 마음 산책 기록 (가상) */
function seedSampleWalks() {
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647; const pick = a => a[Math.floor(rnd() * a.length)];
  const base = new Date(); const out = [];
  const REFL = ["생각보다 금방 마음이 가라앉았다.", "별로 달라진 건 없지만 잠깐 쉰 느낌.", "창밖 소리가 들렸다.", "", "", "발이 바닥에 닿는 느낌이 좋았다."];
  const plan = [[0, 7, 50], [1, 21, 30], [3, 12, 40], [5, 8, 0], [8, 17, 30], [11, 22, 10], [15, 7, 40], [19, 13, 0], [23, 18, 20], [28, 21, 50], [34, 8, 10], [41, 12, 30], [47, 20, 0], [55, 16, 40]];
  plan.forEach(([ago, h, m], i) => {
    const st = new Date(base); st.setDate(st.getDate() - ago); st.setHours(h, m, 0, 0); if (st > base) st.setDate(st.getDate() - 1);
    const planned = pick([30, 60, 60, 60, 120, 180]); const early = rnd() < 0.25; const actual = early ? Math.round(planned * (0.3 + rnd() * 0.5)) : planned;
    const en = new Date(st.getTime() + actual * 1000 + (rnd() < 0.3 ? 20000 : 0));
    const hasEm = rnd() < 0.7;
    out.push({ id: "sample-w" + (i + 1), sample: true, date: dayKey(st), startedAt: st.toISOString(), endedAt: en.toISOString(), plannedSec: planned, actualSec: actual,
      kind: pick(["breath", "breath", "senses", "text"]), ended: early ? "early" : "complete", before: hasEm ? [pick(EMOTIONS)] : [], beforeCustom: "",
      after: hasEm && rnd() < 0.8 ? [pick(EMOTIONS)] : [], afterCustom: "", reasons: rnd() < 0.75 ? [pick(WALK_REASONS)] : [], reasonCustom: "", reflection: pick(REFL), createdAt: en.toISOString() });
  });
  const TH = ["rest", "senses", "emotion", "complex", "still"];
  out.forEach((x, i) => { const h = new Date(x.startedAt).getHours(); x.theme = h < 10 ? "morning" : h >= 20 ? "evening" : x.kind === "senses" ? "senses" : TH[i % TH.length]; });
  repo.walks.save([...repo.walks.all().filter(x => !x.sample), ...out]);
  repo.checkins.save([...repo.checkins.all().filter(x => !x.sample), { id: "sample-c1", sample: true, createdAt: new Date(base.getTime() - 2 * 86400000).toISOString(), emotions: ["불안", "피곤함"], custom: "", answers: [{ q: CK_QUESTIONS[3], a: "일찍 자는 것" }] }]);
}

/* =========================================================
   [모듈] 백업과 복구 — Backup
   파일 형식(melink-backup, formatVersion 1)
   - 잠그지 않은 백업: { format, formatVersion, app, schema, createdAt, encrypted:false, categories, counts, digest, data }
   - 비밀번호 백업:     { format, formatVersion, app, createdAt, encrypted:true, kdf:{PBKDF2·SHA-256·600,000회·salt}, cipher:{AES-GCM, iv}, payload }
     payload를 풀면 { schema, categories, counts, digest, data }
   - digest = data를 JSON으로 만든 문자열의 SHA-256. 가져올 때 다시 계산해 손상 여부를 확인한다.
   - 가져온 파일은 JSON 데이터로만 읽는다(실행하지 않음). 항목마다 형식을 검사하고, 알려진 필드만 남긴다.
   - 3-1단계의 ‘내 기록 내보내기’ 파일(app:"ME:LINK", exportedAt)도 읽는다(formatVersion 0으로 취급).
   ========================================================= */
const Backup = {
  FORMAT: "melink-backup", VERSION: 1, MAX_BYTES: 30 * 1024 * 1024,
  CATS: [["letters", "편지와 답장", "과거의 나에게 남긴 답장, 즐겨찾기·태그 포함"], ["emotions", "감정 기록", "지금 나의 마음, 오늘의 감정"], ["walks", "마음 산책 기록", "활동 전후 감정, 이유, 성찰, 돌아보는 질문의 답"],
    ["phrases", "간직한 말", "자기돌봄 문장"], ["portfolios", "성장 포트폴리오", ""], ["questions", "질문 기록", "오늘의 질문과 지난 질문"], ["settings", "개인 설정", "닉네임, 수신 시간, 화면 설정 등"]],
  KEYS: { letters: ["letters"], emotions: ["checkins", "mood"], walks: ["walks", "walknotes"], phrases: ["phrases"], portfolios: ["portfolios"], questions: ["qhistory", "today"], settings: ["settings"] },
  build(sel, noSamples) {
    const keep = x => !(noSamples && x && x.sample);
    const data = {};
    if (sel.letters) data.letters = repo.letters.all().filter(keep);
    if (sel.emotions) { data.checkins = repo.checkins.all().filter(keep); const m = Store.get("mood", null); if (m) data.mood = m; }
    if (sel.walks) { data.walks = repo.walks.all().filter(keep); data.walknotes = repo.walkNotes.all(); }
    if (sel.phrases) data.phrases = repo.phrases.all();
    if (sel.portfolios) data.portfolios = repo.portfolios.all();
    if (sel.questions) { data.qhistory = repo.qHistory.get(); const t = repo.today.get(); if (t) data.today = t; }
    if (sel.settings) { const st = repo.settings.get(); delete st.userId; data.settings = st; }
    if (sel.letters && sel.emotions && sel.walks && sel.phrases && sel.portfolios && sel.questions && sel.settings) {
      const q = Store.keys().filter(k => k.startsWith("quarantine/")).map(k => Store.get(k)); if (q.length) data.quarantine = q;
    }
    return data;
  },
  counts(data) { const c = {}; for (const [k, v] of Object.entries(data)) c[k] = Array.isArray(v) ? v.length : 1; return c; },
  async file(sel, noSamples, password) {
    const data = this.build(sel, noSamples); const categories = Object.keys(sel).filter(k => sel[k]);
    const digest = await Vault.sha256(JSON.stringify(data)); const counts = this.counts(data);
    const head = { format: this.FORMAT, formatVersion: this.VERSION, app: "ME:LINK", createdAt: new Date().toISOString() };
    if (!password) return JSON.stringify(Object.assign(head, { schema: SCHEMA, encrypted: false, categories, counts, digest, data }));
    const salt = Vault.rnd(16); const key = await Vault.kek(password, salt, Vault.ITER);
    const env = await Vault.encryptJSON(key, { schema: SCHEMA, categories, counts, digest, data });
    return JSON.stringify(Object.assign(head, { encrypted: true, kdf: { name: "PBKDF2", hash: "SHA-256", iterations: Vault.ITER, salt: Vault.b64(salt) }, cipher: { name: "AES-GCM", iv: env.iv }, payload: env.ct }));
  },
  /* 1단계: 파일을 읽고 형식만 확인한다(이때는 아무것도 바꾸지 않는다) */
  parse(text) {
    let j; try { j = JSON.parse(text); } catch (e) { return { error: "ME:LINK 백업 파일이 아니거나, 내용이 손상되어 읽을 수 없어." }; }
    if (!j || typeof j !== "object" || Array.isArray(j)) return { error: "ME:LINK 백업 파일 형식이 아니야." };
    if (j.format === this.FORMAT) {
      if (typeof j.formatVersion !== "number") return { error: "백업 파일의 버전 정보를 읽을 수 없어." };
      if (j.formatVersion > this.VERSION) return { error: `더 새로운 ME:LINK에서 만든 백업이야(형식 ${j.formatVersion}). 지금 버전에서는 안전하게 읽을 수 없어.` };
      if (j.encrypted) { if (!j.kdf || !j.kdf.salt || !j.cipher || !j.cipher.iv || typeof j.payload !== "string") return { error: "비밀번호 백업의 형식이 손상되어 있어." }; return { file: j, encrypted: true }; }
      if (!j.data || typeof j.data !== "object") return { error: "백업 안에 기록 데이터가 없어." };
      return { file: j, encrypted: false, inner: { schema: j.schema, categories: j.categories, counts: j.counts, digest: j.digest, data: j.data } };
    }
    if (j.app === "ME:LINK" && j.exportedAt) { /* 3-1단계 ‘내 기록 내보내기’ 파일 */
      const data = {}; ["letters", "checkins", "walks", "phrases", "portfolios"].forEach(k => { if (Array.isArray(j[k])) data[k] = j[k]; }); if (Array.isArray(j.walkNotes)) data.walknotes = j.walkNotes;

      catch (e) { toast(e && e.name === "AbortError" ? "공유를 취소했어" : "이 화면에서는 공유 기능을 쓸 수 없어. 복사해서 보내 줘."); } return; }
    case "hm-cancel": { const t = $("#hm-text").value.trim();
      if (t && !(await confirmDialog({ title: "작성을 취소할까?", body: "적은 글은 저장되지 않고 사라져.", ok: "취소하고 나가기", cancel: "계속 쓰기" }))) return;
      state.hm = null; return go("help"); }

    /* 설정 */
    case "s-hidenotif": return setToggle("hideNotifContent");
    case "s-voice": return setToggle("voice");
    case "s-ambient": return setToggle("ambient");
    case "s-unloadfx": return setToggle("unloadFx");
    case "s-rm": return setToggle("reduceMotion", "애니메이션을 줄였어", "애니메이션을 다시 켰어");
    case "me-letters": state.rk = "timeline"; return go("rings");
    case "me-checkins": return checkinsDialog();
    case "me-pf": state.rk = "portfolio"; return go("rings");
    case "me-excluded": return excludedDialog();
    case "me-export": return backupDialog("select");
    case "replay-onb": state.onbStep = 0; state.onbData = null; state.replay = true; { const s = repo.settings.get(); state.onbData = { nickname: s.nickname, delivery: { ...s.delivery }, notify: s.notify, samples: false }; } return go("onboarding");
  }
});

/* 시계 & 도착 확인 */
setInterval(() => {
  if (Store.locked) return;
  const c = $("#clock"); if (c) { const n = new Date(); c.textContent = `${fmtDate(n)} · ${fmtTime(n)}`; }
  const arrived = Delivery.tick(); /* 도착 알림은 Delivery.tick → Arrival이 맡는다(어느 경로로 도착해도 같은 알림) */
  if (arrived) { if (["today", "postbox"].includes(state.view)) render(); else renderNav(); }
}, 30000);
document.addEventListener("visibilitychange", () => {
  if (document.hidden || Store.locked) return;
  const arrived = Delivery.tick();
  if (arrived && ["today", "postbox"].includes(state.view)) render(); else Arrival.show();
});

/* 시작 */
(async function boot() {
  document.head.insertAdjacentHTML("beforeend", `<style>${PD_CSS}</style>`);
  if (DEMO) {
    document.title = "ME:LINK 모의 학급 체험";
    $("#app").insertAdjacentHTML("afterbegin", `<div class="demobar" id="demobar" role="note">${demoBar()}</div>`);
    /* 마지막 안전장치: 어디서 만들어진 링크든 전화·문자·이메일은 열지 않는다 */
    document.addEventListener("click", e => { const a = e.target.closest && e.target.closest("a"); const h = a && (a.getAttribute("href") || "");
      if (a && /^(tel|sms|mailto|intent):/i.test(h)) { e.preventDefault(); e.stopImmediatePropagation(); toast("체험 모드라서 실제 신고나 연락이 이루어지지 않아요.", null, { info: true }); } }, true);
    document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target && e.target.dataset && e.target.dataset.demoHref) { e.preventDefault(); e.target.click(); } });
  }
  $("#view").innerHTML = `<div class="onb" style="align-items:flex-start">${G.rings(64)}<p class="muted">나를 만나러 가는 중…</p></div>`;
  try { await Store.init(); } catch (e) { console.warn("store:", e && e.name); }
  applyTheme(); renderStoreBar();
  try { await Promise.all([Questions.load(), RestData.load(), School.load()]); }
  catch (e) { $("#view").innerHTML = `<div class="empty">질문 데이터를 불러오지 못했어. 페이지를 새로 고쳐 줘.</div>`; return; }
  if (Store.locked) { state.view = "lock"; try { history.replaceState({ view: "lock", params: {} }, "", "#locked"); } catch (e) {} render(); return; }
  await startApp();
})();
</script>
</body>
</html>
