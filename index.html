<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#527867">
<title>ME:LINK 미링크</title>
<style>
/* 글꼴: 앱과 함께 배포(외부 연결 없음). 상용 한글 2,350자 + 영문·문장부호. 그 밖의 글자는 기기 글꼴로 보임. OFL 라이선스(fonts/OFL-*.txt) */
@font-face{font-family:"Gowun Batang";src:url("fonts/GowunBatang-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Gowun Batang";src:url("fonts/GowunBatang-700.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"IBM Plex Sans KR";src:url("fonts/IBMPlexSansKR-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Sans KR";src:url("fonts/IBMPlexSansKR-600.woff2") format("woff2");font-weight:600;font-display:swap}
/* 레이아웃: 휴대폰 한 손 너비의 세로 다이어리 한 권. 화면 = 다이어리의 한 장. */
:root{
  --bg:#F8F6F0;          /* 아이보리 */
  --surface:#FFFFFF;
  --tint:#E4ECE6;        /* 라이트 그린 */
  --ink:#24322B;
  --ink-soft:#56655D;
  --brand:#355747;       /* 딥 그린 */
  --accent:#527867;      /* 세이지 그린 */
  --on-accent:#FFFFFF;
  --line:#DDD8CB;
  --paper:#FFFDF7;
  --paper-rule:#ECE5D5;
  --test:#8A6A2F;
  --test-bg:#FBF3E2;
  --shadow:0 1px 2px rgba(53,87,71,.06),0 6px 20px rgba(53,87,71,.07);
  --ring-a:#F2E9D5; --ring-b:#E5EDE6; --ring-line:#9AB2A4; --ring-sel:#C3DACB; --keep:#A5772F;
  --sun:#F1D9A6; --help-bg:#355747; --help-ink:#FFFFFF; --urgent:#A2483A; --urgent-bg:#FFF4F0; --on-urgent:#FFFFFF;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:18px;
  color-scheme:light;
}
body.t-morning{ --bg:#F6EEDD; --surface:#FFFBF2; --paper:#FFFCF3; --line:#E4D8BF; --paper-rule:#EFE3C9; }
body.t-evening{
  --bg:#26364B; --surface:#2F425A; --tint:#36506A; --ink:#EEF1EC; --ink-soft:#B9C5CF;
  --brand:#D5E6DB; --accent:#93BCA7; --on-accent:#17263A; --line:#44597A;
  --paper:#31455E; --paper-rule:#3D5370; --test:#E9C987; --test-bg:#3B4A5E;
  --ring-a:#34495F; --ring-b:#2F4C52; --ring-line:#7F9FAE; --ring-sel:#4D7766; --keep:#E9C987;
  --sun:#C9B27E; --help-bg:#F2E6C9; --help-ink:#1D2B3D; --urgent:#F3B3A5; --urgent-bg:#3A3140; --on-urgent:#2A1A1A;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.18);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;transition:background-color .6s ease,color .6s ease;}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative;
  padding:env(safe-area-inset-top) 0 0}
#view{flex:1;padding:20px 18px 120px;display:flex;flex-direction:column;gap:22px}
#view.full{padding-bottom:40px}
.enter{animation:enter .45s ease both}
@keyframes enter{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 공통 요소 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brandmark{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;color:var(--brand);letter-spacing:.02em}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.label{font-size:13px;color:var(--ink-soft);letter-spacing:.02em}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.section-h h2{font-family:var(--f-display);font-size:19px;color:var(--brand)}
.btn{min-height:48px;padding:0 20px;border-radius:999px;border:1px solid transparent;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-text{background:none;border:none;color:var(--accent);font-weight:600;min-height:44px;padding:0 6px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink-soft)}
.small{font-size:14px}
.tiny{font-size:12.5px}

.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  display:inline-flex;align-items:center;gap:6px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--tint);border-color:var(--accent);color:var(--brand);font-weight:600}
.chip[aria-pressed="true"]::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--brand)}
.tag-test{background:var(--test-bg);color:var(--test);border:1px dashed var(--test)}
.tag-sample{background:transparent;border:1px solid var(--line);color:var(--ink-soft)}

.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .label{font-weight:600;font-size:15px;color:var(--ink)}
.input{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.note{font-size:13.5px;color:var(--ink-soft);line-height:1.55}
.notice{border-radius:14px;padding:12px 14px;background:var(--tint);color:var(--ink);font-size:14px;line-height:1.55}
.notice-test{background:var(--test-bg);border:1px dashed var(--test);color:var(--ink)}
.notice-test strong{color:var(--test)}

/* 하단 내비게이션 */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:20;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#nav[hidden]{display:none}
#nav button{background:none;border:none;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11.5px;color:var(--ink-soft);border-radius:12px;position:relative}
#nav button svg{width:24px;height:24px}
#nav button[aria-current="page"]{color:var(--brand);font-weight:600}
#nav button[aria-current="page"] svg{color:var(--accent)}
#nav .dot{position:absolute;top:8px;right:calc(50% - 18px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;line-height:18px;font-weight:600}

/* 온보딩 */
.onb{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;gap:28px;padding:24px 6px}
.onb .logo{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.onb .logo svg{width:76px;height:auto}
.onb h1{font-family:var(--f-display);font-size:40px;letter-spacing:.03em;color:var(--brand);line-height:1.1}
.onb .slogan{font-family:var(--f-display);font-size:18px;color:var(--accent)}
.onb .poem{font-family:var(--f-display);font-size:17.5px;line-height:1.95;color:var(--ink);display:flex;flex-direction:column;gap:18px}
.onb .poem p{opacity:0;animation:enter .8s ease forwards}
.steps-dots{display:flex;gap:6px}
.steps-dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.steps-dots i.on{background:var(--accent)}
.option-list{display:flex;flex-direction:column;gap:8px}
/* [6-1] 내가 만든 질문 · 하루 돌아보기 길잡이 */
.own-label{display:block;margin-top:2px}
.paper textarea.own-q{width:100%;min-height:64px;height:auto;resize:vertical;border:1px dashed var(--accent);border-radius:12px;background:var(--surface);background-image:none;padding:10px 12px;font-family:var(--f-display);font-size:18px;line-height:1.5;color:var(--ink)}
.own-q:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.body-label{margin-top:12px}
.rguide{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:4px 14px}
.rguide>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:15px;color:var(--brand)}
.rguide-in{display:flex;flex-direction:column;gap:10px;padding:4px 0 12px}
.rg-q[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
.rg-q[aria-pressed="true"] .radio{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 45%,transparent 50%)}
.rg-ref{margin-top:10px;border-left:4px solid var(--tint);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:4px}
.rg-ref[hidden]{display:none}
.rg-ref p{margin:0;font-family:var(--f-display);font-size:16px;color:var(--ink)}
.ownq-item{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.ownq-item .q{font-family:var(--f-display);font-size:16.5px}
.option{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.option[aria-checked="true"]{border-color:var(--accent);background:var(--tint)}
.option .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.option[aria-checked="true"] .radio{border-color:var(--accent)}
.option[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.option .t{font-weight:600}
.option .d{font-size:13px;color:var(--ink-soft)}
.switch{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);width:100%;text-align:left}
.switch .track{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s;margin-top:2px}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"] .track{background:var(--accent)}
.switch[aria-checked="true"] .track::after{transform:translateX(18px)}

/* 메인 */
.hello h1{font-family:var(--f-display);font-size:26px;line-height:1.35;color:var(--ink)}
.hello h1 em{font-style:normal;color:var(--brand)}
.datetime{font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.q-card{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px 20px 16px;box-shadow:var(--shadow)}
.q-card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;
  background:repeating-linear-gradient(135deg,var(--accent) 0 10px,transparent 10px 18px,#C9A96B 18px 28px,transparent 28px 36px);opacity:.55}
.q-card .domain{font-size:12.5px;color:var(--accent);font-weight:600;letter-spacing:.04em}
.q-card .q{font-family:var(--f-display);font-size:22px;line-height:1.5;margin:10px 0 16px;color:var(--ink)}
.q-card .actions{display:flex;flex-wrap:wrap;gap:4px;border-top:1px dashed var(--paper-rule);padding-top:8px;margin:0 -6px}
.q-card .stamp{position:absolute;right:14px;top:16px;width:44px;opacity:.5}
.feel-msg{font-family:var(--f-display);font-size:15px;color:var(--ink-soft)}
.write-cta{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:22px;border:none;background:var(--accent);color:var(--on-accent);text-align:left;box-shadow:var(--shadow)}
.write-cta svg{width:44px;height:44px;flex:none}
.write-cta .t{font-family:var(--f-display);font-size:19px;font-weight:700}
.write-cta .d{font-size:13.5px;opacity:.9}
.arrive{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--accent);background:var(--tint);border-radius:var(--r);padding:14px 16px;color:var(--ink)}
.arrive svg{width:40px;height:40px;flex:none;color:var(--accent)}
.recent{display:flex;flex-direction:column;gap:10px}
.rec{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);width:100%;text-align:left}
.rec .day{flex:none;width:44px;text-align:center;font-family:var(--f-display);color:var(--brand);line-height:1.15}
.rec .day b{display:block;font-size:22px}
.rec .day span{font-size:12px;color:var(--ink-soft)}
.rec .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.rec .line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.help-link{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:transparent;border:1px solid var(--line);width:100%;text-align:left;color:var(--ink)}
.help-link svg{width:26px;height:26px;color:var(--accent);flex:none}
.empty{border:1px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--ink-soft);font-size:14.5px}

/* 편지 쓰기 */
.paper{background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 22px 22px;box-shadow:var(--shadow);padding:22px 20px 18px;position:relative}
.paper .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.paper .to{font-family:var(--f-display);font-size:16px;color:var(--brand);margin:14px 0 4px}
.paper .pq{font-family:var(--f-display);font-size:18px;line-height:1.55;color:var(--ink);margin-bottom:6px}
.paper textarea{width:100%;min-height:260px;resize:vertical;border:none;background:
  repeating-linear-gradient(to bottom,transparent 0,transparent 33px,var(--paper-rule) 33px,var(--paper-rule) 34px);
  line-height:34px;font-family:var(--f-display);font-size:17px;padding:0 2px;outline:none;color:var(--ink)}
.paper textarea::placeholder{color:var(--ink-soft);opacity:.75}
.paper .from{text-align:right;font-family:var(--f-display);color:var(--ink-soft);margin-top:4px}
.draft-state{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;min-height:20px}
.draft-state::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.7}
.draft-state.bad{color:var(--urgent);font-weight:600}.draft-state.bad::before{background:var(--urgent)}
.fold{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.custom-time{display:flex;align-items:center;gap:10px}
.custom-time input{width:140px}
.sticky-send{position:sticky;bottom:0;z-index:5;display:flex;flex-direction:column;gap:4px;padding:14px 0 calc(8px + env(safe-area-inset-bottom));margin:0 -18px;padding-left:18px;padding-right:18px;background:linear-gradient(to bottom,transparent,var(--bg) 22%)}

/* 보내기 애니메이션 */
.sent{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-top:30px}
.sent .scene{width:220px;height:200px;position:relative}
.sent .env{position:absolute;left:50%;top:0;width:96px;margin-left:-48px;animation:drop 1.3s cubic-bezier(.5,0,.6,1) .25s both}
.sent .box{position:absolute;left:50%;bottom:0;width:150px;margin-left:-75px}
@keyframes drop{0%{transform:translateY(0) rotate(-6deg);opacity:1}70%{transform:translateY(78px) rotate(0) scale(.8);opacity:1}100%{transform:translateY(96px) scale(.6);opacity:0}}
.sent h2{font-family:var(--f-display);font-size:24px;color:var(--brand)}

/* 우체통 */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.tab .n{font-variant-numeric:tabular-nums;opacity:.8;font-size:13px}
.mail{display:flex;gap:14px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);align-items:flex-start;box-shadow:var(--shadow)}
.mail.is-new{border-color:var(--accent)}
.mail .env-ico{flex:none;width:48px;height:40px;color:var(--accent)}
.mail .content{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mail .when{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.mail .title{font-family:var(--f-display);font-size:17px;line-height:1.45}
.mail .sealed{font-size:14px;color:var(--ink-soft)}
.mail .mail-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.mail .mail-actions .btn{min-height:40px;padding:0 14px;font-size:14px}
.btn-test{background:var(--test-bg);color:var(--test);border:1px dashed var(--test)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft)}
.status.s-arrived{border-color:var(--accent);color:var(--brand);background:var(--tint)}
.status svg{width:13px;height:13px}

/* 편지 읽기 */
.thread{position:relative;display:flex;flex-direction:column;gap:18px;padding-left:28px}
.thread::before{content:"";position:absolute;left:10px;top:18px;bottom:28px;width:2px;background:repeating-linear-gradient(to bottom,var(--accent) 0 6px,transparent 6px 11px);opacity:.6}
.node{position:relative}
.node .ring{position:absolute;left:-28px;top:6px;width:22px;height:22px;border-radius:50%;border:3px solid var(--accent);background:var(--bg)}
.node.evening .ring{border-color:var(--brand);background:var(--brand)}
.node .who{font-family:var(--f-display);font-weight:700;color:var(--brand);font-size:17px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.node .who span{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--ink-soft)}
.letter-body{font-family:var(--f-display);font-size:17.5px;line-height:1.9;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.reflect{background:var(--tint);border-radius:16px;padding:14px 16px}
.reflect .label{color:var(--brand)}
.reflect .rq{font-family:var(--f-display);font-size:19px;line-height:1.5;margin-top:4px}
.reply-box textarea{min-height:170px}

/* 쉼터 / 설정 */
.call-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.call{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);min-height:92px}
.call b{font-size:24px;font-variant-numeric:tabular-nums;color:var(--brand);font-family:var(--f-display)}
.call span{font-size:13.5px;color:var(--ink-soft);line-height:1.4}
.soon{display:flex;flex-direction:column;gap:8px}
.soon li{list-style:none;display:flex;justify-content:space-between;gap:8px;padding:12px 14px;border-radius:14px;border:1px dashed var(--line);color:var(--ink-soft);font-size:15px}
.soon{padding:0;margin:0}
.set-group{display:flex;flex-direction:column;gap:12px}
.set-group h2{font-family:var(--f-display);font-size:18px;color:var(--brand)}
.status-list{margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.status-list li{list-style:none;display:flex;gap:10px;font-size:14.5px;align-items:flex-start}
.status-list .k{flex:none;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;margin-top:2px}
.k-done{background:var(--tint);color:var(--brand)}
.k-test{background:var(--test-bg);color:var(--test);border:1px dashed var(--test)}
.k-later{border:1px solid var(--line);color:var(--ink-soft)}
.danger{color:#A2483A}
body.t-evening .danger{color:#F0A897}
.rings-art{display:grid;place-items:center;padding:12px 0}
.rings-art svg{width:min(260px,70vw);height:auto}

/* 대화상자 & 토스트 */
#dialog{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(20,30,26,.42)}
#dialog.open{display:flex}
#dialog .sheet{width:100%;max-width:480px;background:var(--bg);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .3s ease both;max-height:88vh;overflow:auto}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#dialog h2{font-family:var(--f-display);font-size:20px;color:var(--brand)}
#toast{position:fixed;left:0;right:0;margin:0 auto;bottom:92px;z-index:60;max-width:calc(100% - 32px);width:440px;
  background:var(--brand);color:var(--bg);border-radius:16px;padding:12px 16px;font-size:14.5px;box-shadow:var(--shadow);display:none;gap:10px;align-items:center}
#toast.show{display:flex;animation:enter .3s ease both}
/* [6-2] 편지 도착 알림(앱 사용 중): 화면 아래쪽(토스트 자리)의 작은 카드. 위쪽 ‘도움’ 버튼을 가리지 않도록. 초점을 빼앗지 않고, 닫아도 편지는 우체통에 남는다 */
.arrival{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom, 0px));margin:0 auto;z-index:65;width:440px;max-width:calc(100% - 24px);background:var(--surface);color:var(--ink);border:1px solid var(--accent);border-radius:18px;box-shadow:0 8px 28px rgba(30,50,40,.18);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.arrival[hidden]{display:none}
.arrival b{font-family:var(--f-display);font-size:16.5px;color:var(--brand)}
.arrival .an-sub{font-size:14px;color:var(--ink-soft)}
.arrival .an-row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.arrival .an-row .btn{min-height:40px;padding:0 14px;font-size:14.5px}
@media (prefers-reduced-motion:no-preference){.arrival:not([hidden]){animation:enter .3s ease both}}
#toast button{margin-left:auto;background:none;border:1px solid currentColor;color:inherit;border-radius:999px;min-height:36px;padding:0 12px;font-size:13.5px;flex:none}


/* ===== 2단계: 마음나이테 ===== */
.rings-head h1{font-family:var(--f-display);font-size:26px;color:var(--brand)}
.rings-head p{font-family:var(--f-display);color:var(--ink-soft);font-size:16px;margin-top:4px}
.tree-wrap{display:flex;flex-direction:column;gap:12px;align-items:center}
.tree-svg{width:min(340px,100%);height:auto;touch-action:manipulation}
.ring-band{cursor:pointer;transition:fill .35s ease}
.ring-band:hover{opacity:.85}
.year-nav{display:flex;align-items:center;justify-content:center;gap:16px;width:100%}
.year-nav b{font-family:var(--f-display);font-size:19px;color:var(--brand);min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
.icon-btn.flip svg{transform:scaleX(-1)}
.icon-btn[disabled]{opacity:.3;cursor:default}
.month-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%}
.mchip{min-height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-variant-numeric:tabular-nums}
.mchip.cur{box-shadow:inset 0 0 0 2px var(--brand);font-weight:600}
.mchip[aria-pressed="true"]{background:var(--ring-sel);color:var(--brand);font-weight:700;border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-soft);justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:16px;height:10px;border-radius:5px;display:inline-block}
.lg-cur{border:2.5px solid var(--brand)}.lg-sel{background:var(--ring-sel)}.lg-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}.lg-fut{border:1.5px dashed var(--ring-line)}
.story-list{display:flex;flex-direction:column;gap:12px}
.story{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 10px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.story.is-fav{border-color:color-mix(in srgb,var(--keep) 55%,var(--line))}
.story-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.story .when{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.keep-title{font-family:var(--f-display);font-weight:700;color:var(--brand);font-size:17px}
.sq{font-family:var(--f-display);color:var(--accent);font-size:15px;line-height:1.5}
.sb{font-family:var(--f-display);font-size:16.5px;line-height:1.75;white-space:pre-wrap}
.story .sealed{font-size:14px;color:var(--ink-soft)}
.story-reply{border-left:3px solid var(--accent);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:4px}
.story-reply.later{border-left-style:dashed}
.story-reply p{font-family:var(--f-display);white-space:pre-wrap;line-height:1.7}
.story-f{display:flex;gap:2px;align-items:center;flex-wrap:wrap;margin:2px -6px 0;border-top:1px dashed var(--line);padding-top:2px}
.star-btn{width:44px;height:44px;margin:-10px -10px 0 0;border-radius:12px;border:none;background:none;color:var(--ink-soft);display:grid;place-items:center;flex:none}
.star-btn[aria-pressed="true"],.icon-btn.star[aria-pressed="true"],.chip[data-act="tl-fav"][aria-pressed="true"] svg{color:var(--keep)}
.emo-ico{color:var(--c);flex:none}
body.t-evening .emo-ico{color:color-mix(in srgb,var(--c) 50%,#fff)}
.cal-wrap{display:flex;flex-direction:column;gap:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd{text-align:center;font-size:12.5px;color:var(--ink-soft);padding:4px 0}
.cal-day{min-height:60px;border-radius:12px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 1px;font-variant-numeric:tabular-nums}
.cal-day .n{font-size:14px}
.cal-day .ic{display:flex;gap:1px;align-items:center;min-height:14px;justify-content:center;color:var(--ink-soft)}
.cal-day .more{font-size:10.5px;color:var(--ink-soft)}
.cal-day.has{background:var(--paper);border-color:var(--line)}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--brand)}
.cal-day.today .n{font-weight:700;color:var(--brand)}
.cal-day[aria-pressed="true"]{background:var(--ring-sel);border-color:var(--accent)}
.tl-controls{display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;color:var(--ink-soft)}
.search input{flex:1;border:none;background:none;outline:none;min-height:44px;color:var(--ink);min-width:0}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.sel-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sel select{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:14.5px}
.tl-month{font-family:var(--f-display);font-size:16px;color:var(--ink-soft);margin:8px 0 -2px;display:flex;align-items:center;gap:10px}
.tl-month::after{content:"";flex:1;height:1px;background:var(--line)}
.intro{font-family:var(--f-display);font-size:16px;line-height:1.7}
.past-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.past-opt{min-height:96px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:2px;padding:14px;text-align:left;box-shadow:var(--shadow)}
.past-opt:last-child{grid-column:1/-1;min-height:72px}
.past-opt b{font-family:var(--f-display);font-size:16.5px;color:var(--brand)}
.past-opt span{font-size:13px;color:var(--ink-soft)}
.past-title{font-family:var(--f-display);font-size:21px;color:var(--brand)}
.past-title span{font-size:14px;color:var(--ink-soft);font-weight:400;font-family:var(--f-body)}
.past-empty{font-family:var(--f-display);font-size:16.5px;line-height:1.8;padding:28px 18px}
.node.later .ring{border-style:dashed;border-color:var(--accent);background:var(--bg)}
.flow-sec{display:flex;flex-direction:column;gap:10px}
.flow-h{font-family:var(--f-display);font-size:19px;color:var(--brand)}
.flow-msg{font-family:var(--f-display);font-size:16.5px}
.flow-chips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14.5px}
.fchip b{font-weight:500}
.fchip span{color:var(--ink-soft);font-variant-numeric:tabular-nums;font-size:13px}
.fstrip-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px 6px}
.fstrip{display:flex;gap:4px;width:max-content}
.fday{width:28px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:10px;border:1px solid transparent}
.fday.has{background:var(--paper);border-color:var(--line)}
.fday .am,.fday .pm{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:16px}
.fday .pm{border-top:1px dashed var(--line);padding-top:3px;width:70%}
.fday .d{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.year-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ymon{min-height:60px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;font-size:13px}
.ymon .ic{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.ymon[aria-pressed="true"]{background:var(--ring-sel);border-color:var(--accent);font-weight:700;color:var(--brand)}
.cmp{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);width:100%}
.cmp .when{font-size:13px;color:var(--ink-soft)}
.cmp-row{display:flex;gap:10px;align-items:center}
.cmp-row .label{width:30px;flex:none}
.closing{font-family:var(--f-display);text-align:center;color:var(--brand);font-size:17px;padding:8px 0}
.pf-card{display:flex;flex-direction:column;gap:4px;text-align:left;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);width:100%;box-shadow:var(--shadow)}
.pf-card b{font-family:var(--f-display);font-size:18px;color:var(--brand)}
.pf-sec{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.pf-sec-title{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;color:var(--brand)}
.icon-btn.sm{width:40px;height:40px;border-radius:10px;font-size:16px;flex:none}
.pf-note{min-height:100px;padding:10px 12px;line-height:1.7;font-family:var(--f-display)}
.pf-letters{margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pf-letters li{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--paper);border:1px solid var(--line)}
.pf-l{display:flex;flex-direction:column;min-width:0}
.pick-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.pick{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);width:100%}
.pick .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center}
.pick[aria-checked="true"]{border-color:var(--accent);background:var(--tint)}
.pick[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent)}
.pick[aria-checked="true"] .box::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.pd-frame{background:#F8F6F0;border:1px solid var(--line);border-radius:var(--r);padding:20px 16px;color:#24322B;max-height:60vh;overflow:auto}
.option[disabled]{opacity:.5;cursor:default}

/* ===== 3단계: 마음 쉼터 ===== */
.help-chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--brand);background:var(--surface);color:var(--brand);font-weight:600;font-size:14px}
.help-chip svg{width:18px;height:18px}
.rest-hero{display:flex;flex-direction:column;gap:4px}
.rest-art{width:100%;height:auto;margin-bottom:-8px}
.rest-hero h1,.rest-h1{font-family:var(--f-display);font-size:27px;color:var(--brand)}
.rest-hero .lead{font-family:var(--f-display);font-size:18px;color:var(--accent)}
.sub{font-family:var(--f-display);font-size:16px;line-height:1.75;color:var(--ink-soft)}
.help-now{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;background:var(--help-bg);color:var(--help-ink);text-decoration:none;box-shadow:var(--shadow)}
.help-now b{font-size:17px}
.help-now span{font-size:14px;line-height:1.5}
.help-now .hn-ico svg{width:30px;height:30px}
.help-now>span:last-child{font-size:26px;margin-left:auto}
.rest-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rest-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;min-height:124px;border-radius:20px;border:1px solid var(--line);background:var(--paper);text-align:left;box-shadow:var(--shadow)}
.rest-card:last-child{grid-column:1/-1;min-height:92px}
.rest-card svg{width:28px;height:28px;color:var(--accent)}
.rest-card b{font-family:var(--f-display);font-size:17px;color:var(--brand)}
.rest-card span{font-size:13.5px;color:var(--ink-soft);line-height:1.45}
.limits{display:flex;flex-direction:column;gap:8px;font-family:var(--f-display);font-size:15px;line-height:1.7;color:var(--ink-soft);border-left:3px solid var(--accent);padding-left:14px}
.sugg{display:flex;flex-direction:column;gap:10px}
.sugg-list{display:flex;flex-direction:column;gap:8px}
.sugg-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);min-height:52px}
.sugg-btn>span:last-child{color:var(--accent);font-size:20px}
.sugg-inline{margin-top:6px;padding:12px 14px;border-radius:14px;background:var(--tint);font-family:var(--f-display);line-height:1.7}
.ck-q summary{cursor:pointer;min-height:40px;display:flex;align-items:center;gap:6px}
.walk-run{display:flex;flex-direction:column;align-items:center;gap:16px;min-height:calc(100vh - 80px)}
.walk-run .top{width:100%}
.walk-stage{font-family:var(--f-display);font-size:20px;color:var(--brand);text-align:center;margin-top:8px}
.breathe{width:min(230px,60vw);aspect-ratio:1;position:relative;display:grid;place-items:center}
.breathe::before{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px dashed var(--ring-line);opacity:.7}
.breathe span{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--tint),color-mix(in srgb,var(--accent) 55%,var(--tint)));animation:breathe 10s ease-in-out infinite;transform:scale(.62)}
.breathe.paused span{animation-play-state:paused}
@keyframes breathe{0%,100%{transform:scale(.62)}50%{transform:scale(1)}}
.senses-art{opacity:.6}
.walk-line{font-family:var(--f-display);font-size:19px;line-height:1.75;text-align:center;min-height:3.6em;max-width:30ch}
.walk-run.text .walk-line{font-size:23px;margin-top:30px}
.walk-line.fade{animation:enter .8s ease both}
.walk-rem{font-size:34px;color:var(--brand);font-variant-numeric:tabular-nums;font-family:var(--f-display)}
.walk-ctrl{display:flex;flex-direction:column;gap:8px;width:100%}
.walk-done{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:16px}
.walk-done .sprout{color:var(--accent)}
.unload-msg{font-family:var(--f-display);font-size:17px;line-height:1.85;margin-top:8px}
.unload-wrap{position:relative}
.unload-pad{width:100%;min-height:280px;border:1px solid var(--line);border-radius:20px;background:var(--paper);padding:16px 18px;font-family:var(--f-display);font-size:17px;line-height:1.85;resize:vertical;outline:none;color:var(--ink)}
.unload-pad:focus{border-color:var(--accent)}
.unload-fx{position:absolute;inset:0;padding:17px 19px;pointer-events:none;font-family:var(--f-display);font-size:17px;line-height:1.85;color:var(--ink);white-space:pre-wrap;word-break:break-all;overflow:hidden}
.unload-fx span{display:inline-block;white-space:pre}
.unload-fx.go span{animation:scatter 1.3s ease-in var(--dl) forwards}
@keyframes scatter{to{transform:translate(var(--dx),var(--dy)) rotate(14deg);opacity:0;filter:blur(2px)}}
.word-card{margin:0;padding:34px 24px;border-radius:24px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.word-card::before{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:0 0 0 90px;background:var(--tint);opacity:.8}
.word-card blockquote{margin:0;font-family:var(--f-display);font-size:22px;line-height:1.65;color:var(--brand);position:relative}
.word-card.refresh blockquote{color:var(--ink)}
.kept-word{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.kept-word>p:first-child{font-family:var(--f-display);font-size:16.5px;line-height:1.6}
.help-h1{font-family:var(--f-display);font-size:26px;color:var(--brand)}
.urgent{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;border:2px solid var(--urgent);background:var(--urgent-bg);outline:none}
.urgent h2{font-size:19px;color:var(--urgent);font-weight:700}
a.btn{text-decoration:none;text-align:center}
.q-note{margin-top:10px;line-height:1.6}
.rp-intro{display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.6}
.rp-map{display:flex;flex-direction:column;gap:8px}
.rp-map a{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:inherit}
.rp-map a span{font-size:13px;color:var(--muted, inherit);opacity:.85}
.rp-sec{display:flex;flex-direction:column;gap:10px;scroll-margin-top:12px}
.rp-h{font-size:16px;font-weight:600;margin:0}
.rp-num{font-size:18px;font-weight:600;margin:4px 0 0;letter-spacing:.02em}
.hm-sec{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface)}
.hm-sec h2{font-size:15px;font-weight:600;margin:0}
.hm-addr{font-family:inherit;word-break:break-all}
.hm-after{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;background:var(--accent-bg, var(--surface));border:1.5px solid var(--accent)}
.urgent-calls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.u-call{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:16px;background:var(--urgent);color:var(--on-urgent);text-decoration:none}
.u-call b{font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.u-call span{font-size:13.5px}
.urgent-calls.sm .u-call{background:var(--surface);color:var(--ink);border:1.5px solid var(--urgent)}
.urgent-calls.sm .u-call b{font-size:22px;color:var(--ink)}

  <nav id="nav" aria-label="주요 메뉴" hidden></nav>

<script>
"use strict";
/* =========================================================
   [5-5] 모의 학급 체험 모드 — DEMO
   class.html(<meta name="melink-mode" content="class">) 또는 주소 ?mode=class 로 열면 켜진다.
   - 저장소: 기기 저장소(IndexedDB·localStorage)를 열지도 읽지도 않고 화면 메모리에만 둔다. 새로 열면 처음부터.
   - 시계: 체험 화면 안에서만 ‘아침 조례/종례’ 시각으로 옮겨 보는 체험용 시계. 일반 모드에는 없다.
   - 연락: 전화·문자·이메일·공유를 실제로 열지 않는다.
   ========================================================= */
const DEMO = (() => { try { const m = document.querySelector('meta[name="melink-mode"]'); return (m && m.content === "class") || /(?:^|[?&])mode=class(?:&|$)/.test(location.search.slice(1)); } catch (e) { return false; } })();
const DemoClock = (() => {
  if (!DEMO) return { set() {}, reset() {}, offset: () => 0 };
  const Real = Date; let off = 0;
  class DDate extends Real { constructor(...a) { if (a.length) super(...a); else super(Real.now() + off); } static now() { return Real.now() + off; } }
  window.Date = DDate;
  return { set(h, m = 0) { const t = new Real(Real.now() + off); t.setHours(h, m, 0, 0); off = t.getTime() - Real.now(); }, reset() { off = 0; }, offset: () => off };
})();
/* =========================================================
   ME:LINK — 모듈 지도 (4단계)
   한 파일(index.html) 안에서 영역별로 나누어 두었다. 독립 웹앱으로 옮길 때 이 단위로 파일을 나누면 된다.
   [저장]   Vault(암호화) · Store(저장소: IndexedDB→localStorage→임시 메모리, 이전·격리·암호화) · repo(기록 종류별 접근)
   [데이터] migrate(기록 형식 1→5) · seedSamples/seedSampleWalks(예시 기록)
   [질문]   Questions(질문 선택) — data/questions.json
   [편지]   Delivery(예약 편지 상태) · views.compose/sent/postbox/letter
   [감정]   EMOTIONS · emoIcon · views.today 의 감정 고르기 · views.checkin
   [나이테] RV.tree/calendar/timeline/walk/past/keep/flow/portfolio · storyCard · walkCard
   [쉼터]   RestData(data/care.json, data/refresh.json) · WalkRT(마음 산책 타이머) · views.rest/walk/unload/words/refresh
   [안전]   CONTACTS · views.help/bully/helpmsg · HM(전할 말 예시)
   [설정]   views.me · Backup(백업·복구) · Lock(앱 잠금) · 기록 보호 대화상자 · StoreBar(저장 상태 안내)
   [화면]   state · go/render(라우팅) · 이벤트 위임(document click) · boot/startApp
   ========================================================= */
/* =========================================================
   [모듈] 암호화 도구 — Vault
   브라우저 표준 Web Crypto만 쓴다(자체 알고리즘 없음).
   - 비밀번호 → 키: PBKDF2-SHA-256, 600,000회, 무작위 16바이트 솔트
   - 기록 암호화: AES-GCM 256비트, 값마다 새 12바이트 IV
   - 비밀번호·PIN 자체는 어디에도 저장하지 않는다(감싼 데이터 키만 저장)
   ========================================================= */
const Vault = {
  ITER: 600000,
  ok() { try { return !!(window.crypto && crypto.subtle && crypto.getRandomValues && window.isSecureContext !== false); } catch (e) { return false; } },
  b64(buf) { const a = buf instanceof Uint8Array ? buf : new Uint8Array(buf); let s = ""; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); },
  unb64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); },
  rnd(n) { return crypto.getRandomValues(new Uint8Array(n)); },
  async kek(pass, salt, iterations) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(String(pass).normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt, iterations }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt", "wrapKey", "unwrapKey"]);
  },
  newKey() { return crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]); },
  async wrap(key, kek) { const iv = this.rnd(12); const w = await crypto.subtle.wrapKey("raw", key, kek, { name: "AES-GCM", iv }); return { iv: this.b64(iv), key: this.b64(w) }; },
  unwrap(w, kek) { return crypto.subtle.unwrapKey("raw", this.unb64(w.key), kek, { name: "AES-GCM", iv: this.unb64(w.iv) }, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]); },
  async encryptJSON(key, value) { const iv = this.rnd(12); const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(value))); return { __enc: 1, iv: this.b64(iv), ct: this.b64(ct) }; },
  async decryptJSON(key, env) { const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: this.unb64(env.iv) }, key, this.unb64(env.ct)); return JSON.parse(new TextDecoder().decode(pt)); },
  async sha256(str) { const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)); return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join(""); }
};

/* =========================================================
   [모듈] 저장소 — Store
   - 화면 코드는 예전처럼 Store.get/set(동기)을 쓴다. 값은 메모리 캐시에 바로 반영되고,
     기기 저장은 뒤에서 순서대로 처리한다: IndexedDB → (안 되면) localStorage → (둘 다 안 되면) 임시 메모리.
   - 실제로 저장이 끝났는지는 Store.flush()로만 확인한다. 실패는 Store.status에 남고 화면 위 안내로 보인다.
   - 1~3-1단계의 localStorage 기록은 IndexedDB로 옮긴 뒤 다시 읽어 똑같은지 확인하고,
     다음 실행에서도 IndexedDB에 그대로 있을 때에만 예전 저장소를 지운다.
   - 기록 보호가 켜져 있으면 meta·lock·pub(기록 내용 없음)을 뺀 모든 값을 암호화해 저장한다.
   - 형식이 맞지 않는 값은 지우지 않고 quarantine/ 아래로 옮겨 보관한다.
   ========================================================= */
const Store = (() => {
  const P = "melink.v1.";
  const PLAIN = new Set(["meta", "lock", "pub"]);
  const ARRAYS = ["letters", "checkins", "walks", "walknotes", "phrases", "portfolios", "qhistory"];
  const OBJECTS = ["settings", "meta", "today", "mood", "draft", "lock", "pub", "backup-v1", "undo-restore"];
  const cache = {};
  const dirty = new Set(), deleted = new Set();
  const listeners = new Set();
  let backend = null, dek = null, chain = Promise.resolve(), timer = null;
  const status = { mode: "init", error: null, unsaved: false, quarantined: [], migratedFromLS: false, legacyRemoved: false, locked: false, fallbackReason: null };
  const clone = v => v === undefined ? undefined : (typeof structuredClone === "function" ? structuredClone(v) : JSON.parse(JSON.stringify(v)));
  const emit = () => listeners.forEach(f => { try { f(status); } catch (e) {} });
  const errKind = e => { const n = (e && e.name) || ""; if (n === "QuotaExceededError" || n === "NS_ERROR_DOM_QUOTA_REACHED" || (e && e.code === 22)) return "quota";
    if (n === "SecurityError" || n === "NotAllowedError" || n === "InvalidStateError") return "denied"; if (n === "LockedError") return "locked"; return "fail"; };
  const shapeOk = (k, v) => {
    if (k.startsWith("quarantine/")) return true;
    if (ARRAYS.includes(k)) return Array.isArray(v);
    if (OBJECTS.includes(k)) return v !== null && typeof v === "object" && !Array.isArray(v);
    if (k.startsWith("replydraft-") || k.startsWith("pastdraft-")) return typeof v === "string";
    return true;
  };
  const protectedOn = () => !!(cache.lock && cache.lock.wrapped);
  /* 쓰기 메모(WAL): IndexedDB 저장은 몇 밀리초 늦게 끝나므로, 바뀐 값을 localStorage에 곧바로 적어 둔다.
     IndexedDB 저장이 끝나면 지운다. 화면을 바로 닫아도 다음에 열 때 이 메모로 마지막 변경을 되살린다.
     기록 보호(암호화)가 켜져 있으면 평문이 남지 않도록 쓰지 않는다. */
  const W = "melink.wal.";
  const walOn = () => backend && backend.kind === "idb" && !protectedOn();
  function walWrite(k, v, del) { if (!walOn()) return; try { localStorage.setItem(W + k, JSON.stringify(del ? { d: 1 } : { v })); } catch (e) { try { localStorage.removeItem(W + k); } catch (x) {} } }
  function walClear(k) { try { localStorage.removeItem(W + k); } catch (e) {} }
  function walKeys() { try { return Object.keys(localStorage).filter(k => k.startsWith(W)); } catch (e) { return []; } }
  function walClearAll() { walKeys().forEach(k => { try { localStorage.removeItem(k); } catch (e) {} }); }

  /* ---- 백엔드 ---- */
  function openIDB() {
    return new Promise((res, rej) => {
      let settled = false; const fin = (f, x) => { if (!settled) { settled = true; clearTimeout(to); f(x); } };
      const to = setTimeout(() => fin(rej, Object.assign(new Error("timeout"), { name: "TimeoutError" })), 4000);
      let req; try { req = indexedDB.open("melink", 1); } catch (e) { return fin(rej, e); }
      req.onupgradeneeded = () => { try { req.result.createObjectStore("kv"); } catch (e) {} };
      req.onerror = () => fin(rej, req.error); req.onblocked = () => fin(rej, Object.assign(new Error("blocked"), { name: "InvalidStateError" }));
      req.onsuccess = () => {
        const db = req.result;
        const run = (mode, fn) => new Promise((ok, no) => { let t, r; try { t = db.transaction("kv", mode); r = fn(t.objectStore("kv")); } catch (e) { return no(e); }
          t.oncomplete = () => ok(r && "result" in r ? r.result : undefined); t.onerror = () => no(t.error); t.onabort = () => no(t.error || Object.assign(new Error("abort"), { name: "AbortError" })); });
        fin(res, { kind: "idb",
          getAll: () => new Promise((ok, no) => { const out = {}; let t; try { t = db.transaction("kv", "readonly"); } catch (e) { return no(e); }
            const c = t.objectStore("kv").openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } };
            t.oncomplete = () => ok(out); t.onerror = () => no(t.error); }),
          put: (k, v) => run("readwrite", st => st.put(v, k)), del: k => run("readwrite", st => st.delete(k)), clear: () => run("readwrite", st => st.clear()) });
      };
    });
  }
  function lsBackend() {
    const t = P + "__probe"; localStorage.setItem(t, "1"); localStorage.removeItem(t);
    return { kind: "ls",
      getAll: async () => { const out = {}; for (const k of Object.keys(localStorage)) if (k.startsWith(P)) out[k.slice(P.length)] = localStorage.getItem(k); return out; },
      put: async (k, v) => localStorage.setItem(P + k, JSON.stringify(v)), del: async k => localStorage.removeItem(P + k),

function compactQHistory(h, today = dayKey()) {
  const byDay = new Map(); h.forEach((x, i) => { if (!byDay.has(x.date)) byDay.set(x.date, []); byDay.get(x.date).push(i); });
  const keep = new Set(); const t = new Date(today + "T00:00:00"); t.setDate(t.getDate() - 181); const cut = dayKey(t);
  byDay.forEach((idx, d) => {
    if (d >= cut) { idx.forEach(i => keep.add(i)); return; }
    const offer = idx.find(i => h[i].via !== "change"); keep.add(offer != null ? offer : idx[0]); keep.add(idx[idx.length - 1]);
  });
  return h.filter((_, i) => keep.has(i)).slice(-3000);
}
const Questions = {
  bank: null, byId: {},
  async load() {
    const res = await fetch("data/questions.json", { cache: "no-cache" });
    if (!res.ok) throw new Error("questions " + res.status);
    this.bank = await res.json();
    this.bank.questions.forEach(q => { if (q.light == null) { const d = this.domain(q.domain); q.light = !!(d && d.light); } this.byId[q.id] = q; });
  },
  domain(id) { return this.bank.domains.find(d => d.id === id); },
  /* 질문 고르기 v3 (5-2단계) — 질문 기록(qhistory: 어떤 질문이 언제 나왔는지)만 쓴다. 편지 내용·감정은 전혀 보지 않는다.
     기록의 via: "offer"(그날 처음 받은 질문) / "change"(학생이 ‘다른 질문 보기’로 고른 질문). 예전 기록에는 via가 없고, 그날의 첫 기록이 처음 받은 질문이다.
     1) 날마다 ‘처음 받은 질문’을 기준으로 최근 14일의 가벼운 질문 비율을 30%에 가깝게 맞춘다.
        학생이 바꿔 고른 질문의 종류는 비율·연속 계산에 넣지 않는다(바꿔 고른 선택이 다음 날 질문을 줄이지 않도록).
        5단계(v2)는 마지막으로 본 질문을 기준으로 해서, 가벼운 질문으로 바꾸면 다음 날부터 가벼운 질문이 덜 나왔다.
        (가벼운 비율이 낮으면 가벼운 질문이 나올 가능성이 커지고, 높으면 작아진다. 5%~60% 사이에서 움직인다.
         2)의 ‘연속 막기’가 가벼운 질문을 조금 더 부르므로 기본값을 20%로 두었다. 1년 시뮬레이션에서 약 31%)
     2) 깊이 생각하는 질문이 3일 이어지면 다음 날은 가벼운 질문을, 가벼운 질문이 3일 이어지면 생각하는 질문을 고른다.
     3) 최근 2일 동안 처음 받은 질문의 영역과 어제 마지막으로 본 질문의 영역, 지금 보고 있는 영역은 빼서 같은 영역이 이어지지 않게 한다(남는 영역이 없으면 적어도 어제 영역은 뺀다). 요일마다 정해진 영역은 없다.
     4) 오래 안 나온 영역일수록 뽑힐 가능성이 커진다(가중치 = 1 + 지난 일수, 최대 15).
     5) 같은 질문은 180일 안에 다시 나오지 않는다. 모두 나왔다면 가장 오래전에 나온 질문부터.

  LIGHT_TARGET: 0.3, LIGHT_BASE: 0.2, LIGHT_GAIN: 2.5, MAX_STREAK: 3, REPEAT_DAYS: 180, DOMAIN_GAP_DAYS: 2,
  choose(hist, now, rnd, { excludeDomains = [], excludeIds = [], basis = "offer" } = {}) {
    const B = this.bank, byId = this.byId;
    /* basis "offer": 처음 받은 질문 기준(5-2 기본). "final": 마지막으로 본 질문 기준(5단계 방식, 비교 시뮬레이션용) */
    const offerOf = new Map(), finalOf = new Map();
    hist.forEach(h => { if (!offerOf.has(h.date) || (offerOf.get(h.date).via === "change" && h.via !== "change")) offerOf.set(h.date, h); finalOf.set(h.date, h); });
    const perDay = basis === "final" ? finalOf : offerOf;
    const days = [...perDay.keys()].sort().filter(d => d < dayKey(now));
    const lastDays = days.slice(-14).map(d => perDay.get(d));
    const isLight = h => { const q = byId[h.qid]; return q ? !!q.light : !!(this.domain(h.domain) || {}).light; };
    let streakType = null, streak = 0;
    for (let i = days.length - 1; i >= 0; i--) { const l = isLight(perDay.get(days[i])); if (streakType === null) streakType = l; if (l !== streakType) break; streak++; }
    let wantLight;
    if (streak >= this.MAX_STREAK) wantLight = !streakType;
    else {
      const ratio = lastDays.length ? lastDays.filter(isLight).length / lastDays.length : this.LIGHT_TARGET;
      const p = Math.max(0.05, Math.min(0.6, this.LIGHT_BASE + (this.LIGHT_TARGET - ratio) * this.LIGHT_GAIN));
      wantLight = rnd() < p;
    }
    const recent = new Set(excludeDomains);
    days.slice(-this.DOMAIN_GAP_DAYS).forEach(d => recent.add(perDay.get(d).domain));
    if (days.length) recent.add(finalOf.get(days[days.length - 1]).domain);
    let domains = B.domains.filter(d => !!d.light === wantLight && !recent.has(d.id));
    const yesterday = days.length ? finalOf.get(days[days.length - 1]).domain : null;
    if (!domains.length) domains = B.domains.filter(d => !!d.light === wantLight && !excludeDomains.includes(d.id) && d.id !== yesterday);
    if (!domains.length) domains = B.domains.filter(d => !excludeDomains.includes(d.id) && d.id !== yesterday);
    if (!domains.length) domains = B.domains.filter(d => !excludeDomains.includes(d.id));
    const lastSeen = {}, shownAt = {};
    hist.forEach(h => { lastSeen[h.domain] = h.date; shownAt[h.qid] = h.date; });
    const weights = domains.map(d => 1 + Math.min(lastSeen[d.id] ? daysBetween(lastSeen[d.id], now) : 15, 15));
    let r = rnd() * weights.reduce((a, b) => a + b, 0), chosen = domains[domains.length - 1];
    for (let i = 0; i < domains.length; i++) { r -= weights[i]; if (r < 0) { chosen = domains[i]; break; } }
    let pool = B.questions.filter(q => q.domain === chosen.id && !excludeIds.includes(q.id));
    if (!pool.length) pool = B.questions.filter(q => q.domain === chosen.id && q.id !== excludeIds[excludeIds.length - 1]); /* 하루에 한 영역의 질문을 다 바꿔 본 경우 */
    let fresh = pool.filter(q => !shownAt[q.id] || daysBetween(shownAt[q.id], now) > this.REPEAT_DAYS);
    if (!fresh.length) { const oldest = pool.slice().sort((a, b) => (shownAt[a.id] || "").localeCompare(shownAt[b.id] || "")); fresh = oldest.slice(0, 1); }
    return fresh[Math.floor(rnd() * fresh.length)] || B.questions[0];
  },
  pick(opts = {}, via = "offer") {
    const hist = repo.qHistory.get(); const now = new Date();
    const q = this.choose(hist, now, rand, opts);
    hist.push({ qid: q.id, domain: q.domain, date: dayKey(now), via });

  },
  /* 오늘의 질문은 하루 동안 그대로 유지된다(새로 고침·다시 열기 모두). 날짜가 바뀌면 새 질문 */
  today() {
    let t = repo.today.get();
    if (!t || t.date !== dayKey() || ((t.mode === "question" || t.mode === "skip") && !this.byId[t.qid])) {
      const q = this.pick();
      t = { date: dayKey(), mode: "question", qid: q.id };
      repo.today.save(t);
    }
    return t;
  },
  /* 다른 질문 보기: 횟수 제한 없음. 지금 영역과 오늘 이미 본 질문은 피한다 */
  change() {
    const cur = this.today();
    const exclude = cur.qid && this.byId[cur.qid] ? [this.byId[cur.qid].domain] : [];
    const seenToday = repo.qHistory.get().filter(h => h.date === dayKey()).map(h => h.qid);

  setFree() { const t = this.today(); repo.today.save({ ...t, mode: "free" }); },
  setSkip() { const t = this.today(); repo.today.save({ ...t, mode: "skip" }); },
  setQuestion() { const t = this.today(); repo.today.save({ ...t, mode: "question" }); },
  /* 편지에 남기는 질문 사본: 질문 문장이 나중에 다듬어져도 그날 받은 질문은 그대로 남는다 */

  /* 예전 편지에 사본을 채울 때: 편지를 쓴 날 이후에 문장이 바뀌었다면 이전 문장을 쓴다 */

};

/* ---------- 수신 예약 ---------- */
const DELIVERY_OPTIONS = [
  { kind: "17", t: "오후 5시" }, { kind: "19", t: "오후 7시" }, { kind: "21", t: "오후 9시" },
  { kind: "custom", t: "직접 고르기" }, { kind: "keep", t: "알림 없이 보관하기" }
];
/* [모듈] 예약 편지 상태 — Delivery
   상태: waiting(도착 전) → arrived(도착) → read(읽음) → replied(답장)
   - deliveredAt은 한 번만 정해진다(중복 도착 없음). 이미 도착한 편지는 예약을 바꾸거나 테스트로 다시 받을 수 없다.
   - 시간 정보가 잘못된 편지는 기다리게 두지 않고 바로 도착 처리한다. */
const validHM = t => /^([01]\d|2[0-3]):[0-5]\d$/.test(t || "") ? t : "20:00";
const Delivery = {
  at(pref, from = new Date()) {
    if (!pref || pref.kind === "keep") return null;
    let h, m = 0;
    if (pref.kind === "custom") [h, m] = validHM(pref.custom).split(":").map(Number);
    else { h = Number(pref.kind); if (![17, 19, 21].includes(h)) h = 19; }
    const d = new Date(from); d.setHours(h, m, 0, 0);
    if (d <= from) d.setDate(d.getDate() + 1);
    return d.toISOString();
  },
  label(pref) {
    if (!pref || pref.kind === "keep") return "알림 없이 보관하기";
    if (pref.kind === "custom") { const [h, m] = validHM(pref.custom).split(":").map(Number); return fmtTime(new Date(2000, 0, 1, h, m)); }
    const o = DELIVERY_OPTIONS.find(o => o.kind === pref.kind); return o ? o.t : "오후 7시";
  },
  status(l) { if (l.reply) return "replied"; if (l.readAt) return "read"; if (l.deliveredAt) return "arrived"; return "waiting"; },
  /* 예약 시간이 지난 편지를 도착 처리 (앱을 열 때, 열려 있는 동안 30초마다) */
  /* [6-2] live: 이 화면(세션)에서 처음 도착 확인을 한 뒤에 예약 시간이 되어 도착한 편지만 알림 대상으로 기록한다(메모리, 저장 안 함).
     앱을 닫아 둔 사이 도착한 편지는 처음 확인 때 조용히 도착 처리하고, 오늘의 나의 ‘편지가 도착했어’로 보인다. */
  live: false,
  tick() {
    const now = Date.now(); let arrived = 0; const fresh = [];
    const list = repo.letters.all();
    list.forEach(l => {
      if (l.deliveredAt) return;
      const t = l.deliverAt ? Date.parse(l.deliverAt) : NaN;
      if (isNaN(t)) { l.deliveredAt = l.createdAt || new Date().toISOString(); arrived++; }
      else if (t <= now) { l.deliveredAt = l.deliverAt; arrived++; if (this.live && !l.sample) fresh.push(l.id); }
    });
    if (arrived) repo.letters.save(list);
    this.live = true;
    if (fresh.length) Arrival.add(fresh);
    return arrived;
  },
  /* 테스트 기능: 기다리는 편지만 바로 도착시킨다 */
  testNow(id) { const l = repo.letters.get(id); if (!l || l.deliveredAt) return false; l.deliveredAt = new Date().toISOString(); l.testDelivered = true; repo.letters.put(l); return true; },
  reschedule(id, pref) {
    const l = repo.letters.get(id); if (!l || l.deliveredAt) return false;
    l.pref = { kind: pref.kind, custom: validHM(pref.custom) }; l.deliverAt = this.at(l.pref);
    if (l.pref.kind === "keep") l.deliveredAt = new Date().toISOString();
    repo.letters.put(l); return true;
  }
};

/* =========================================================
   [6-2] 편지 도착 알림
   - 앱 사용 중: 어느 화면이든 아래쪽에 작은 카드(편지 읽기 / 나중에 볼게). 여러 통이면 한 카드로 묶음. 같은 편지는 한 번만.
   - 기기 알림: 사용자가 설정에서 켜고 브라우저가 허용했을 때만, 화면이 가려져 있을 때(다른 탭·창) 보냄. 편지 내용·질문·감정은 넣지 않음.
   - 앱(탭)을 닫으면 도착을 확인하는 코드가 돌지 않으므로 알림이 없다(서버 푸시 없음).
   - 무엇을 알렸는지는 저장하지 않는다(새로 열면 처음부터). 편지 데이터 구조는 바꾸지 않는다.
   ========================================================= */
const Arrival = {
  pending: [],
  add(ids) {
    ids.forEach(id => { if (!this.pending.includes(id)) this.pending.push(id); });
    if (document.hidden) DeviceNotify.show(this.pending.length);
    this.show();
  },
  live() { return this.pending.filter(id => { const l = repo.letters.get(id); return l && l.deliveredAt && !l.readAt; }); },
  show() {
    const el = document.getElementById("arrival"); if (!el) return;
    if (Store.locked || document.hidden || state.view === "onboarding") { el.hidden = true; return; } /* 잠금·가려진 동안에는 기다렸다가 보여 준다 */
    this.pending = this.live();
    if (!this.pending.length) { el.hidden = true; el.innerHTML = ""; return; }
    const n = this.pending.length;
    el.innerHTML = `<b>${n > 1 ? `아침의 나에게서 편지 ${n}통이 도착했어 💌` : "아침의 나에게서 편지가 도착했어 💌"}</b>
      <span class="an-sub">잠시 시간을 내어 그때의 마음을 만나 볼까?</span>
      <div class="an-row"><button type="button" class="btn btn-ghost" data-act="arr-later">나중에 볼게</button><button type="button" class="btn btn-primary" data-act="arr-read">편지 읽기</button></div>`;
    el.hidden = false;
  },
  later() { this.pending = []; this.show(); },
  read() { const ids = this.live(); this.pending = []; this.show();
    if (ids.length === 1) return go("letter", { id: ids[0] });
    state.mbFilter = "arrived"; return go("postbox"); }
};

   - 기존 편지·답장·설정은 그대로 두고 새 필드만 채운다(ownerId, favorite, title, tags, excludeFromMemories, laterReplies)

const SCHEMA = 6;

  const meta = Store.get("meta", { schema: 1 }); const from = meta.schema;

  if (from < 2) {
    /* 1 → 2: 편지에 새 필드 채우기, 원본 백업 */
    const rawLetters = Store.get("letters", []);
    if (!Store.get("backup-v1", null) && (rawSettings || rawLetters.length)) Store.set("backup-v1", { settings: rawSettings, letters: rawLetters, savedAt: new Date().toISOString() });
    if (rawSettings && !rawSettings.userId) { rawSettings.userId = "u-" + uid(); Store.set("settings", rawSettings); }
    const owner = (rawSettings && rawSettings.userId) || "local";
    const hadSamples = rawLetters.some(l => l.sample);
    Store.set("letters", rawLetters.map(l => normalizeLetter(l, owner)));
    if (hadSamples) seedSamples();
    kept = rawLetters.filter(l => !l.sample).length;
  }
  if (from < 3) {
    /* 2 → 3: 마음 쉼터 설정 기본값만 더한다. 기존 기록은 건드리지 않는다 */

  }
  if (from < 4 && from >= 2) {

    if (Store.get("letters", []).some(l => l.sample) && !Store.get("walks", []).some(x => x.sample)) seedSampleWalks();
  }
  if (from < 5) {
    /* 4 → 5: 마음 산책 기록에 멈춘 시간·화면을 벗어난 시간·대략값 여부 필드를 더한다(기존 값은 그대로) */

       편지 본문·답장·날짜는 건드리지 않는다. 마음 산책 기록에는 활동 종류(theme)를 채운다 */
    const ls = Store.get("letters", null);
    if (Array.isArray(ls) && Questions.bank) Store.set("letters", ls.map(l => l && l.mode === "question" && l.qid && !l.qSnap ? Object.assign({}, l, { qSnap: Questions.snapAt(l.qid) }) : l));
    const ws = Store.get("walks", null);
    if (Array.isArray(ws)) Store.set("walks", ws.map(x => x && !x.theme ? Object.assign({}, x, { theme: x.kind === "senses" ? "senses" : "rest" }) : x));
  }
  Store.set("meta", Object.assign({}, Store.get("meta", {}), { schema: SCHEMA, migratedFrom: from, migratedAt: new Date().toISOString() }));
  return { from, kept };
}

/* ---------- 라우팅 ----------
   화면을 옮길 때마다 기록(history)에 남겨 브라우저의 뒤로 가기가 앱 안에서 동작한다.
   주소에는 화면 이름만 남기고(#postbox 등) 편지 id 같은 값은 넣지 않는다. */
const state = { view: "today", params: {}, onbStep: 0, onbData: null, mbFilter: "all" };
const MAIN_TABS = ["today", "postbox", "rings", "rest", "me"];
const HASH_OF = { letter: "letter", compose: "write", sent: "sent", onboarding: "welcome", helpmsg: "help-message" };
function go(view, params = {}, opt = {}) {
  if (Store.locked && !LOCK_SAFE.includes(view)) { view = "lock"; params = {}; } /* 잠겨 있을 때는 다른 화면 기록을 남기지 않는다 */
  state.view = view; state.params = params;
  try { const h = "#" + (HASH_OF[view] || view); (opt.replace ? history.replaceState : history.pushState).call(history, { view, params }, "", h); } catch (e) {}
  render(); window.scrollTo({ top: 0 });
}
window.addEventListener("popstate", e => {
  closeDialog();
  const st = e.state; const h = (location.hash || "").slice(1);
  if (st && st.view) { state.view = st.view; state.params = st.params || {}; }
  else { state.view = MAIN_TABS.includes(h) ? h : "today"; state.params = {}; }
  render(); window.scrollTo({ top: 0 });
});
async function deleteLetter(id, after) {
  const l = repo.letters.get(id); if (!l) return;
  const inPf = repo.portfolios.all().some(p => p.sections.some(s => s.letterIds.includes(id)));
  if (!(await confirmDialog({ title: "이 기록을 지울까?", body: `아침 편지와 그 뒤에 남긴 답장이 모두 지워지고 되돌릴 수 없어.${inPf ? " 포트폴리오에 담긴 경우 거기서도 빠져." : ""}`, ok: "지우기", danger: true }))) return;
  repo.letters.remove(id);
  if (after) go(after); else render();
  toast("기록을 지웠어");
}
const LOCK_SAFE = ["lock", "help", "bully", "helpmsg", "report"];
function render() {
  applyTheme();
  document.body.classList.toggle("rm", !!repo.settings.get().reduceMotion);
  /* 잠겨 있으면 잠금 화면과 도움 화면만 보여 준다(기록은 메모리에도 없다) */
  if (Store.locked && !LOCK_SAFE.includes(state.view)) state.view = "lock";
  /* 산책 중 다른 화면으로 가면 버리지 않고 멈춰 둔다. 돌아오면 이어 갈지 묻는다(저장은 하지 않음) */
  if (state.view !== "walk" && state.walk) {
    if (state.walk.phase === "run") { if (!state.walk.paused) WalkRT.autoPause("left"); }
    else { WalkRT.stop(); state.walk = null; } /* 준비 중이거나 끝난 산책은 떠나면 정리(저장하지 않은 것은 남지 않음) */
  }
  if (state.view !== "helpmsg") state.hm = null;
  if (!Store.locked) Delivery.tick();
  const s = repo.settings.get();
  if (!Store.locked && !s.onboarded && state.view !== "onboarding") state.view = "onboarding";
  const v = $("#view");
  const fn = views[state.view] || views.today;
  v.className = MAIN_TABS.includes(state.view) ? "" : "full";
  v.innerHTML = fn(state.params);
  if (DEMO && state.demoWelcome) {
    if (state.view !== state.demoWelcome) state.demoWelcome = null; /* 다른 화면으로 옮기면 다시 보이지 않는다 */
    else v.insertAdjacentHTML("afterbegin", `<div class="demo-tip" role="note" id="demo-welcome"><b>ME:LINK에 오신 것을 환영합니다.</b><span>원하는 기능을 자유롭게 살펴보세요. 질문을 읽기만 해도 좋고, 편지를 쓰지 않아도 괜찮습니다.</span><span class="small muted">쓴 글은 이 기기 화면에만 잠시 머물고 발표자에게 전달되지 않아요.</span><div class="row"><button class="btn btn-ghost" data-act="demo-welcome-close">닫기</button></div></div>`);
  }
  Arrival.show();
  if (DEMO) { const tip = DEMO_TIPS[state.view]; if (tip) v.insertAdjacentHTML("afterbegin", `<div class="demo-tip" role="note">${tip()}</div>`); demoDisarm(v); }
  /* 화면이 바뀔 때만 부드럽게 나타나고, 같은 화면 안의 조작(별, 필터)에서는 깜박이지 않는다 */
  const key = state.view + (state.view === "rings" ? ":" + state.rk : "");
  if (key !== render.last) { v.firstElementChild && v.firstElementChild.classList.add("enter"); render.last = key; }
  renderNav(); renderStoreBar();
  afterRender[state.view] && afterRender[state.view]();
}
function renderNav() {
  const nav = $("#nav");
  if (Store.locked || !MAIN_TABS.includes(state.view)) { nav.hidden = true; return; }
  nav.hidden = false;
  const newCount = repo.letters.all().filter(l => Delivery.status(l) === "arrived").length;
  nav.innerHTML = NAV_ITEMS.map(n => `<button type="button" data-go="${n.id}" ${state.view === n.id ? 'aria-current="page"' : ""}>
    ${n.ico}<span>${n.t}</span>${n.id === "postbox" && newCount ? `<span class="dot" aria-label="새 편지 ${newCount}통">${newCount}</span>` : ""}</button>`).join("");
}

function openDialog(html, onMount) {
  const d = $("#dialog"); $("#dialog-sheet").innerHTML = html; d.classList.add("open"); demoDisarm($("#dialog-sheet"));
  const f = d.querySelector("[autofocus]") || d.querySelector("button"); f && f.focus();
  onMount && onMount($("#dialog-sheet"));
}
function closeDialog() { $("#dialog").classList.remove("open"); $("#dialog-sheet").innerHTML = ""; }
function confirmDialog({ title, body, ok = "확인", cancel = "취소", danger = false }) {
  return new Promise(res => {
    openDialog(`<h2 id="dialog-title">${title}</h2><p class="muted">${body}</p>
      <div class="row" style="justify-content:flex-end"><button class="btn btn-ghost" data-r="0">${cancel}</button>
      <button class="btn btn-primary ${danger ? "danger-btn" : ""}" data-r="1">${ok}</button></div>`, sheet => {
      sheet.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { closeDialog(); res(b.dataset.r === "1"); });
    });
  });
}
$("#dialog").addEventListener("click", e => { if (e.target.id === "dialog") closeDialog(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#dialog").classList.contains("open")) closeDialog(); });
let toastTimer;
const SAVE_FAIL_MSG = { quota: "저장 공간이 부족해서 저장하지 못했어. 화면 위 안내를 확인해 줘.", memory: "지금은 임시로만 유지하고 있어. 화면을 닫기 전에 기록을 내려받아 줘.",
  denied: "이 브라우저에서 저장이 막혀 있어. 화면 위 안내를 확인해 줘.", fail: "저장하지 못했어. 화면 위 안내에서 다시 시도해 줘.", locked: "잠겨 있어서 저장하지 못했어." };
/* 기기 저장이 남아 있으면 끝날 때까지 기다렸다가, 실제로 저장된 경우에만 원래 문구를 보여 준다 */
async function toast(msg, action, opt = {}) {
  if (!opt.info && Store.hasPending()) { const r = await Store.flush(); if (!r.ok) { showToast(SAVE_FAIL_MSG[r.error] || SAVE_FAIL_MSG.fail); return false; } }
  showToast(msg, action); return true;
}
function showToast(msg, action) {
  const t = $("#toast");
  t.innerHTML = `<span>${msg}</span>${action ? `<button type="button">${action.label}</button>` : ""}`;
  t.classList.add("show");
  if (action) t.querySelector("button").onclick = () => { t.classList.remove("show"); action.run(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), action ? 7000 : 3200);
}

async function sendLetter() {

/* 1) 나의 마음나이테 ------------------------------------------------ */
function ringSVG(y, sel) {
  const C = 160, pith = 12, w = 11.6, N = 96, now = new Date(), curY = now.getFullYear(), curM = now.getMonth();
  const s = (y % 97) * 0.61;
  const R = pith + 12 * w;
  const rad = (r, t, m) => r + (r / R) * (2.2 * Math.sin(3 * t + s) + 1.5 * Math.sin(5 * t + s * 2.1) + 1.1 * Math.sin(2 * t + s * 0.7)) + 0.55 * Math.sin(7 * t + m * 1.3 + s);
  const path = (r, m) => { let d = ""; for (let i = 0; i <= N; i++) { const t = i / N * Math.PI * 2; const rr = rad(r, t, m); d += (i ? "L" : "M") + (C + rr * Math.cos(t)).toFixed(1) + " " + (C + rr * 0.97 * Math.sin(t)).toFixed(1); } return d + "Z"; };
  const letters = Arch.mine().filter(l => new Date(l.createdAt).getFullYear() === y);
  const walks = repo.walks.all().filter(x => new Date(x.startedAt).getFullYear() === y);
  let bands = "", lines = "", dots = "", labels = "";
  for (let i = 0; i < 12; i++) {
    const r0 = pith + i * w, r1 = r0 + w;
    const future = y > curY || (y === curY && i > curM);
    const isCur = y === curY && i === curM, isSel = i === sel;
    const fill = isSel ? "var(--ring-sel)" : future ? "transparent" : i % 2 ? "var(--ring-a)" : "var(--ring-b)";
    bands += `<path class="ring-band" data-rmonth="${i}" d="${path(r1, i)} ${path(r0, i - 1)}" fill-rule="evenodd" fill="${fill}"><title>${y}년 ${i + 1}월${future ? " · 아직 오지 않은 시간" : ""}</title></path>`;
    lines += `<path d="${path(r1, i)}" fill="none" stroke="${isCur ? "var(--brand)" : "var(--ring-line)"}" stroke-width="${isCur ? 2.6 : isSel ? 1.8 : 1.1}" ${future ? 'stroke-dasharray="2 4" opacity=".7"' : ""} pointer-events="none"/>`;
    letters.filter(l => new Date(l.createdAt).getMonth() === i).forEach(l => {
      const d = new Date(l.createdAt); const t = -Math.PI / 2 + (d.getDate() - 1) / 31 * Math.PI * 2; const rr = rad((r0 + r1) / 2, t, i);
      const e = feelText(l.emotions, l.custom)[0];
      dots += `<circle cx="${(C + rr * Math.cos(t)).toFixed(1)}" cy="${(C + rr * 0.97 * Math.sin(t)).toFixed(1)}" r="2.1" fill="${Arch.sealed(l) ? "none" : e ? emoColor(e) : "var(--brand)"}" stroke="var(--brand)" stroke-width="${Arch.sealed(l) ? 1 : 0}" pointer-events="none"/>`;
    });
    walks.filter(x => new Date(x.startedAt).getMonth() === i).forEach(x => {
      const d = new Date(x.startedAt); const t = -Math.PI / 2 + (d.getDate() - 1) / 31 * Math.PI * 2; const rr = rad(r1 - 2.6, t, i);
      const cx = C + rr * Math.cos(t), cy = C + rr * 0.97 * Math.sin(t); const ang = t * 180 / Math.PI + 90;
      dots += `<path d="M0 0c-1.6-2-1.6-4 0-5.6 1.6 1.6 1.6 3.6 0 5.6z" transform="translate(${cx.toFixed(1)} ${cy.toFixed(1)}) rotate(${ang.toFixed(0)})" fill="var(--accent)" stroke="var(--brand)" stroke-width=".5" pointer-events="none"/>`;
    });
    if (isSel || isCur) {
      const t = isCur ? -Math.PI * 0.5 : Math.PI * 0.5; const rr = rad((r0 + r1) / 2, t, i);

    }
  }
  return `<svg class="tree-svg" viewBox="0 0 320 320" role="img" aria-label="${y}년 마음나이테. 가운데가 1월, 바깥이 12월. ${sel + 1}월 선택됨">

    <circle cx="160" cy="160" r="158" fill="url(#bark)"/>

const TL_DEFAULT = { sort: "new", ym: "all", emo: "all", topic: "all", q: "", fav: false, type: "all" };
/* 편지·마음 산책·지금 나의 마음을 같은 시간줄에 놓는다 */
function tlFiltered() {
  const t = state.tl || (state.tl = { ...TL_DEFAULT }); t.type = t.type || "all";
  const inYm = iso => t.ym === "all" || (t.ym.length === 4 ? new Date(iso).getFullYear() === +t.ym : `${new Date(iso).getFullYear()}-${pad(new Date(iso).getMonth() + 1)}` === t.ym);
  const qq = t.q.trim().toLowerCase();
  let items = [];
  if (t.type === "all" || t.type === "letter") {
    let ls = Arch.mine().filter(l => inYm(l.createdAt));
    if (t.emo !== "all") ls = ls.filter(l => !Arch.sealed(l) && Arch.emotions(l).includes(t.emo));
    if (t.topic !== "all") ls = ls.filter(l => t.topic === "own" ? l.mode === "own" : t.topic === "free" ? (l.mode !== "question" || !l.qid) && l.mode !== "own" : questionFor(l) && questionFor(l).domain === t.topic);
    if (t.fav) ls = ls.filter(l => l.favorite);
    if (qq) ls = ls.filter(l => Arch.text(l).includes(qq));
    items.push(...ls.map(l => ({ type: "letter", at: l.createdAt, x: l })));
  }
  const otherOk = t.topic === "all" && !t.fav;
  if (otherOk && (t.type === "all" || t.type === "walk")) {
    let ws = repo.walks.all().filter(x => inYm(x.startedAt));
    if (t.emo !== "all") ws = ws.filter(x => [...feelText(x.before, x.beforeCustom), ...feelText(x.after, x.afterCustom)].includes(t.emo));
    if (qq) ws = ws.filter(x => [x.reflection, ...walkReasons(x), WALK_KIND[x.kind], WALK_THEME[x.theme], "마음 산책"].join(" ").toLowerCase().includes(qq));
    items.push(...ws.map(x => ({ type: "walk", at: x.startedAt, x })));
  }
  if (otherOk && (t.type === "all" || t.type === "checkin")) {
    let cs = repo.checkins.all().filter(x => inYm(x.createdAt));
    if (t.emo !== "all") cs = cs.filter(x => feelText(x.emotions, x.custom).includes(t.emo));
    if (qq) cs = cs.filter(x => ["지금 나의 마음", ...(x.answers || []).map(a => a.a)].join(" ").toLowerCase().includes(qq));
    items.push(...cs.map(x => ({ type: "checkin", at: x.createdAt, x })));
  }
  return items.sort((a, b) => t.sort === "new" ? b.at.localeCompare(a.at) : a.at.localeCompare(b.at));
}
function tlListHTML() {
  const ls = tlFiltered(); if (!ls.length) return `<div class="empty">조건에 맞는 이야기가 없어.<br>필터를 바꾸거나 검색어를 지워 봐.</div>`;
  let out = "", cur = "";
  ls.forEach(it => { const d = new Date(it.at); const k = `${d.getFullYear()}년 ${d.getMonth() + 1}월`; if (k !== cur) { cur = k; out += `<h3 class="tl-month">${k}</h3>`; }

}

/* 4) 과거의 나 만나기 ------------------------------------------------ */
const PAST_OPTS = [["week", "일주일 전의 나", "7일 전 즈음"], ["month", "한 달 전의 나", "30일 전 즈음"], ["semester", "한 학기 전의 나", "6개월 전 즈음"], ["year", "작년의 나", "1년 전 즈음"], ["random", "무작위로 만나는 과거의 나", "어느 날의 나든"]];
const PAST_PROMPTS = ["그때의 나는 어떤 마음이었을까?", "지금의 나는 어떻게 달라졌을까?", "그때의 나에게 어떤 말을 해주고 싶을까?", "지금도 변하지 않은 나의 모습은 무엇일까?"];
function pastCandidates(mode) {
  const now = Date.now(), D = 86400000, win = { week: [7, 3], month: [30, 7], semester: [182, 30], year: [365, 30] };
  let c = Arch.mine().filter(l => !Arch.sealed(l) && !l.excludeFromMemories && Arch.dk(l) !== dayKey());
  if (mode !== "random") { const [t, w] = win[mode]; c = c.filter(l => Math.abs((now - new Date(l.createdAt)) / D - t) <= w); }
  return c;
}
function pastPick(mode, notId) {
  const c = pastCandidates(mode); if (!c.length) return null;
  const pool = c.length > 1 ? c.filter(l => l.id !== notId) : c;
  return pool[Math.floor(rand() * pool.length)].id;
}
RV.past = () => {

  const excluded = Arch.mine().filter(l => l.excludeFromMemories);

      <button class="btn-text" data-act="past-include" data-id="${l.id}">다시 넣기</button></div>`).join("")}</div></details>` : "";
  if (!p.mode) return `<section style="display:flex;flex-direction:column;gap:14px">

    <div class="past-grid">${PAST_OPTS.map(([k, t, d]) => `<button class="past-opt" data-past="${k}"><b>${t}</b><span>${d}</span></button>`).join("")}</div>

  const opt = PAST_OPTS.find(o => o[0] === p.mode);

/* 5) 간직한 편지 ---------------------------------------------------- */
